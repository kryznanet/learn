name: Browser E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  playwright:
    if: >-
      github.ref_name == github.event.repository.default_branch ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      KRYZNA_E2E_EMAIL: ${{ secrets.KRYZNA_E2E_EMAIL }}
      KRYZNA_E2E_PASSWORD: ${{ secrets.KRYZNA_E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Browser E2E
        id: e2e
        run: npm run test:e2e

      - name: Record Browser E2E result
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: node scripts/record-browser-e2e.mjs

      - name: Commit Browser E2E result
        if: always()
        run: |
          if git diff --quiet -- docs/BROWSER-E2E-RESULTS.md docs/PROJECT-STATUS.md; then
            echo "No E2E documentation changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BROWSER-E2E-RESULTS.md docs/PROJECT-STATUS.md
          git commit -m "ci: record Browser E2E result [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
