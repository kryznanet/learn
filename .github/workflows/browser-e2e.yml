name: Browser E2E

on:
  push:
    branches:
      - "18-Sep-2026"
      - "19-Sep-2026"
  pull_request:
    branches:
      - "18-Sep-2026"
      - "19-Sep-2026"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      KRYZNA_E2E_EMAIL: ${{ secrets.KRYZNA_E2E_EMAIL }}
      KRYZNA_E2E_PASSWORD: ${{ secrets.KRYZNA_E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Browser E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
