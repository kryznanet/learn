name: Temporary code formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format web and TypeScript files
        run: npx --yes prettier@3.6.2 --write "admin/**/*.html" "*.html" "*.js" "supabase/functions/**/*.ts" "*.json" "README.md"

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/**/*.html *.html *.js supabase/functions/**/*.ts *.json README.md
          git commit -m "style: rapikan format kode"
          git push

      - name: Remove temporary formatter
        run: |
          git rm .github/workflows/format-code.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: hapus formatter sementara"
          git push
