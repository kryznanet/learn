name: Format code

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format HTML, CSS and JS
        run: npx --yes prettier@3.6.2 --write "admin/**/*.html" "*.html" "*.js"

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/**/*.html *.html *.js
          git commit -m "style: rapikan format kode"
          git push
