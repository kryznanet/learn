<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Admin — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>:root{--bg:#f1f5f9;--card:#fff;--text:#172033;--muted:#64748b;--blue:#2563eb;--danger:#dc2626;--border:#e2e8f0}*{box-sizing:border-box;font-family:Segoe UI,sans-serif}body{margin:0;background:var(--bg);color:var(--text)}header{background:#0f172a;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:21px}.top{display:flex;align-items:center;gap:12px}.top button{border:1px solid #ffffff55;background:#ffffff12;color:#fff;padding:9px 13px;border-radius:8px;cursor:pointer}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.stat,.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 5px 18px #00000008}.stat{padding:18px}.stat b{display:block;font-size:26px;color:var(--blue)}.stat span{color:var(--muted);font-size:13px}.card{padding:22px;margin-bottom:20px}h2{margin:0 0 18px;font-size:19px}form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:11px;font-size:15px;background:#fff}textarea{min-height:110px;resize:vertical}.buttons{display:flex;gap:9px}.primary,.secondary,.edit,.delete{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.primary,.edit{background:var(--blue);color:#fff}.secondary{background:#e2e8f0}.delete{background:var(--danger);color:#fff}.msg{margin-top:10px;color:var(--muted);font-size:14px}.item{border:1px solid var(--border);border-radius:11px;padding:15px;margin:10px 0}.item h3{margin:0 0 5px}.item p{color:var(--muted);margin:5px 0 12px}.meta{font-size:12px;color:#64748b}.item .buttons{margin-top:10px}@media(max-width:700px){.stats,form{grid-template-columns:1fr}.full{grid-column:auto}.top span{display:none}}
</style></head><body><header><h1>Kryzna Learn · Admin</h1><div class="top"><span id="user"></span><button onclick="location.href='../index.html'">Website</button><button onclick="logout()">Keluar</button></div></header><main class="wrap"><div class="stats"><div class="stat"><b id="total">0</b><span>Total Materi</span></div><div class="stat"><b id="materiCount">0</b><span>Kategori Materi</span></div><div class="stat"><b id="tutorialCount">0</b><span>Kategori Tutorial</span></div></div><section class="card"><h2 id="title">Tambah Materi</h2><form id="form"><input type="hidden" id="id"><div><label>Judul</label><input id="judul" required placeholder="Contoh: Mengenal IP Address"></div><div><label>Kategori</label><select id="kategori"><option>Materi</option><option>Tutorial</option></select></div><div class="full"><label>Deskripsi Singkat</label><textarea id="deskripsi" required placeholder="Jelaskan isi materi secara singkat..."></textarea></div><div class="full"><label>Link Halaman</label><input id="link" required placeholder="materi/nama-file.html"></div><div class="full buttons"><button class="primary" type="submit">Simpan Materi</button><button class="secondary" type="button" id="cancel" hidden>Batal Edit</button></div></form><div class="msg" id="msg"></div></section><section class="card"><h2>Kelola Materi</h2><div id="list">Memuat...</div></section></main><script>const db=supabaseClient;let rows=[];const $=id=>document.getElementById(id);async function guard(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}const {data:admin,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!admin){await db.auth.signOut();document.body.innerHTML='<main style="max-width:500px;margin:80px auto;text-align:center;font-family:Segoe UI"><h2>Akses Ditolak</h2><p>Akun ini bukan admin.</p><a href="login.html">Kembali ke login</a></main>';return}$('user').textContent=session.user.email;load()}async function load(){const {data,error}=await db.from('materi').select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML='<p>Gagal memuat data: '+esc(error.message)+'</p>';return}rows=data||[];$('total').textContent=rows.length;$('materiCount').textContent=rows.filter(x=>x.kategori==='Materi').length;$('tutorialCount').textContent=rows.filter(x=>x.kategori==='Tutorial').length;render()}function render(){if(!rows.length){$('list').innerHTML='<p>Belum ada materi.</p>';return}$('list').innerHTML=rows.map(x=>`<article class="item"><h3>${esc(x.judul)}</h3><div class="meta">${esc(x.kategori)} · ${esc(x.link_halaman)}</div><p>${esc(x.deskripsi_singkat)}</p><div class="buttons"><button class="edit" onclick="edit('${x.id}')">Edit</button><button class="delete" onclick="hapus('${x.id}')">Hapus</button></div></article>`).join('')}function edit(id){const x=rows.find(r=>r.id===id);if(!x)return;$('id').value=x.id;$('judul').value=x.judul;$('kategori').value=x.kategori;$('deskripsi').value=x.deskripsi_singkat;$('link').value=x.link_halaman;$('title').textContent='Edit Materi';$('cancel').hidden=false;scrollTo({top:0,behavior:'smooth'})}async function hapus(id){if(!confirm('Yakin ingin menghapus materi ini?'))return;const {error}=await db.from('materi').delete().eq('id',id);if(error){alert(error.message);return}load()}$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value;const payload={judul:$('judul').value.trim(),deskripsi_singkat:$('deskripsi').value.trim(),kategori:$('kategori').value,link_halaman:$('link').value.trim()};const r=id?await db.from('materi').update(payload).eq('id',id):await db.from('materi').insert(payload);if(r.error){$('msg').textContent=r.error.message;return}reset();$('msg').textContent='Materi berhasil disimpan.';load()};function reset(){$('form').reset();$('id').value='';$('title').textContent='Tambah Materi';$('cancel').hidden=true}$('cancel').onclick=reset;async function logout(){await db.auth.signOut();location.href='login.html'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}guard();</script></body></html>
