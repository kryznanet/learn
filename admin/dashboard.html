<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard Admin — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>*{box-sizing:border-box;font-family:Segoe UI,sans-serif}body{margin:0;background:#f4f7f6;color:#333}header{background:#1e3a8a;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:22px}header button{background:#fff;color:#1e3a8a;border:0;padding:9px 14px;border-radius:7px;cursor:pointer;font-weight:700}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:#fff;padding:22px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,.07);margin-bottom:22px}h2{color:#1e3a8a;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:600;margin:10px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd5dd;border-radius:7px;font-size:15px}textarea{min-height:120px;resize:vertical}.actions{display:flex;gap:8px;margin-top:14px}button.primary,.edit{background:#0ea5e9;color:#fff;border:0;padding:10px 14px;border-radius:7px;cursor:pointer;font-weight:600}.cancel,.delete{border:0;padding:10px 14px;border-radius:7px;cursor:pointer}.cancel{background:#ddd}.delete{background:#dc3545;color:#fff}.item{border:1px solid #e1e7ec;padding:15px;border-radius:10px;margin:10px 0}.item h3{margin:0 0 5px}.meta{font-size:13px;color:#68727d;margin-bottom:8px}.msg{margin-top:12px;font-weight:600}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>Kryzna Learn — Admin</h1><div><span id="user"></span> <button id="logout">Keluar</button></div></header><main class="wrap"><section class="card"><h2 id="form-title">Tambah Materi</h2><form id="materi-form"><input type="hidden" id="edit-id"><div class="grid"><div><label>Judul</label><input id="judul" required></div><div><label>Kategori</label><select id="kategori"><option value="Materi">Materi</option><option value="Tutorial">Tutorial</option></select></div></div><label>Deskripsi Singkat</label><textarea id="deskripsi" required></textarea><label>Link Halaman</label><input id="link" placeholder="materi/nama-file.html" required><div class="actions"><button class="primary" type="submit">Simpan</button><button class="cancel" type="button" id="cancel" hidden>Batal Edit</button></div><div class="msg" id="msg"></div></form></section><section class="card"><h2>Daftar Materi</h2><div id="list">Memuat...</div></section></main>
<script>
const client=supabaseClient;let records=[];
async function guard(){const {data:{session}}=await client.auth.getSession();if(!session){location.href='login.html';return}document.getElementById('user').textContent=session.user.email;load();}
async function load(){const {data,error}=await client.from('materi').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').innerHTML='<p>Gagal memuat. Pastikan tabel <b>materi</b> sudah dibuat di Supabase.</p>';return}records=data||[];render();}
function render(){const el=document.getElementById('list');if(!records.length){el.innerHTML='<p>Belum ada materi.</p>';return}el.innerHTML=records.map(x=>`<div class="item"><h3>${esc(x.judul)}</h3><div class="meta">${esc(x.kategori||'Materi')} · ${esc(x.link_halaman||'')}</div><p>${esc(x.deskripsi_singkat||'')}</p><div class="actions"><button class="edit" onclick="editItem('${x.id}')">Edit</button><button class="delete" onclick="deleteItem('${x.id}')">Hapus</button></div></div>`).join('')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
window.editItem=id=>{const x=records.find(r=>String(r.id)===String(id));if(!x)return;document.getElementById('edit-id').value=x.id;judul.value=x.judul||'';kategori.value=x.kategori||'Materi';deskripsi.value=x.deskripsi_singkat||'';link.value=x.link_halaman||'';document.getElementById('form-title').textContent='Edit Materi';document.getElementById('cancel').hidden=false;scrollTo(0,0)};
window.deleteItem=async id=>{if(!confirm('Hapus materi ini?'))return;const {error}=await client.from('materi').delete().eq('id',id);if(error){alert(error.message);return}load()};
document.getElementById('materi-form').addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('edit-id').value;const payload={judul:judul.value.trim(),deskripsi_singkat:deskripsi.value.trim(),link_halaman:link.value.trim(),kategori:kategori.value};let result=id?await client.from('materi').update(payload).eq('id',id):await client.from('materi').insert(payload);if(result.error){msg.textContent=result.error.message;return}msg.textContent='Tersimpan.';e.target.reset();document.getElementById('edit-id').value='';document.getElementById('form-title').textContent='Tambah Materi';document.getElementById('cancel').hidden=true;load()});
document.getElementById('cancel').onclick=()=>{document.getElementById('materi-form').reset();document.getElementById('edit-id').value='';document.getElementById('form-title').textContent='Tambah Materi';document.getElementById('cancel').hidden=true};document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.href='login.html'};guard();
</script></body></html>
