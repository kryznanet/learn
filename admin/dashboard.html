<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Admin — Kryzna Learn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/docx-preview@0.4.0/dist/docx-preview.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="../supabase-config.js"></script>
<style>*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}body{margin:0;background:#eef2f7;color:#172033}header{background:#0f172a;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{margin:0;font-size:21px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top button,.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600}.top button{background:#ffffff18;color:#fff;border:1px solid #ffffff44}.wrap{max-width:1200px;margin:25px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat,.card,.item{background:#fff;border:1px solid #d9e0e8;border-radius:14px}.stat{padding:17px}.stat b{display:block;font-size:25px;color:#2563eb}.stat span,.meta,.hint,.status{font-size:12px;color:#64748b}.card{padding:20px;margin-bottom:18px}h2{margin:0 0 16px}form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{font-size:14px;font-weight:600;display:block;margin-bottom:6px}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-size:15px}textarea{min-height:100px}.buttons,.file-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0}.edit{background:#2563eb;color:#fff}.delete{background:#dc2626;color:#fff}.preview{background:#0f766e;color:#fff}.import{background:#7c3aed;color:#fff}.editor{border:1px solid #b9c2cf;border-radius:9px;overflow:visible;background:#fff}.toolbar{background:#f3f5f8;border-bottom:1px solid #cbd5e1;padding:8px;border-radius:9px 9px 0 0;position:relative;z-index:5}.toolbar-row{display:flex;flex-wrap:wrap;gap:8px}.grp{position:relative;display:flex;gap:4px;align-items:center;background:#fff;border:1px solid #d5dde7;border-radius:7px;padding:6px 6px 17px}.grp:after{content:attr(data-group);position:absolute;bottom:2px;left:7px;font-size:9px;color:#64748b;font-weight:700;text-transform:uppercase}.t{height:31px;min-width:34px;padding:0 8px;border:1px solid #d5dde7;background:#fff;border-radius:5px;cursor:pointer;font-weight:600;color:#273449;position:relative}.t:hover{background:#e8eef8}.wide{min-width:64px}.sel{height:31px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;padding:0 7px}.font-sel{width:145px}.size-sel{width:62px}.color-wrap{display:flex;gap:5px}.clr{width:34px;height:31px;padding:3px;border:1px solid #cbd5e1;border-radius:5px;background:#fff}.color-control{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:8px;color:#64748b}.body{min-height:430px;padding:20px;outline:0;font:16px/1.65 Calibri,Segoe UI,Arial,sans-serif}.body:empty:before{content:attr(data-placeholder);color:#94a3b8}.body table{border-collapse:collapse;width:100%;margin:10px 0}.body td,.body th{border:1px solid #9ca3af;padding:7px}.body img{max-width:100%;height:auto}.previewbox{margin-top:12px;border:1px solid #d9e0e8;border-radius:9px;padding:16px;background:#fff;min-height:100px}.previewbox table{border-collapse:collapse;width:100%}.previewbox th,.previewbox td{border:1px solid #cbd5e1;padding:7px}.previewbox img{max-width:100%;height:auto}.ribbon-note{font-size:12px;color:#64748b;margin:0 0 7px}.t[data-tip]:hover:after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:220px;padding:8px;background:#111827;color:#fff;border-radius:6px;font-size:12px;font-weight:400;z-index:9999;white-space:normal}.list-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.search{max-width:320px}.item{padding:14px;margin:10px 0}.item h3{margin:0 0 5px}.item p{color:#64748b;margin:6px 0 10px}.docx-preview{width:100%;background:#f8fafc;padding:12px}.docx-wrapper{background:#fff;margin:0 auto 16px;box-shadow:0 1px 4px #0001}.pdf-page{display:block;width:100%;height:auto;margin:0 auto 16px;background:#fff;box-shadow:0 1px 4px #0001}.importing{opacity:.65;pointer-events:none}@media(max-width:700px){.stats,form{grid-template-columns:1fr}.full{grid-column:auto}.list-head{align-items:stretch;flex-direction:column}.search{max-width:none}}</style></head><body>
<header><h1>Kryzna Learn · Admin</h1><div class="top"><span id="user"></span><button onclick="location.href='../index.html'">Website</button><button onclick="logout()">Keluar</button></div></header>
<main class="wrap"><div class="stats"><div class="stat"><b id="total">0</b><span>Total Materi</span></div><div class="stat"><b id="mc">0</b><span>Kategori Materi</span></div><div class="stat"><b id="tc">0</b><span>Kategori Tutorial</span></div></div>
<section class="card"><h2 id="title">Tambah Materi</h2><form id="form"><input type="hidden" id="id"><div><label>Judul</label><input id="judul" required></div><div><label>Kategori</label><select id="kategori"><option>Materi</option><option>Tutorial</option></select></div><div class="full"><label>Deskripsi Singkat</label><textarea id="deskripsi" required></textarea></div><div class="full"><label>Link Halaman Lama</label><input id="link"><div class="hint">Opsional.</div></div>
<div class="full"><label>Isi Materi — Editor</label><p class="ribbon-note">Word: render DOCX dengan layout/style dipertahankan. PDF: render halaman sebagai gambar resolusi tinggi.</p><div class="file-row"><input type="file" id="importFile" accept=".docx,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden><button type="button" class="btn import" id="importBtn2">Import Word / PDF</button><span class="status" id="importStatus">Pilih file Word (.docx) atau PDF dari PC.</span></div>
<div class="editor"><div class="toolbar"><div class="toolbar-row"><div class="grp" data-group="Clipboard"><button type="button" class="t wide" data-cmd="undo" data-tip="Undo — Batalkan perubahan terakhir">↶ Undo</button><button type="button" class="t wide" data-cmd="redo" data-tip="Redo — Ulangi perubahan">↷ Redo</button></div>
<div class="grp" data-group="Font"><select id="block" class="sel"><option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option><option value="pre">Kode</option></select><select id="font" class="sel font-sel"><option>Calibri</option><option>Arial</option><option>Tahoma</option><option>Verdana</option><option>Georgia</option><option>Times New Roman</option><option>Courier New</option></select><select id="size" class="sel size-sel"><option value="12px">12</option><option value="14px">14</option><option value="16px" selected>16</option><option value="18px">18</option><option value="20px">20</option><option value="24px">24</option><option value="28px">28</option><option value="32px">32</option><option value="40px">40</option></select></div>
<div class="grp" data-group="Text"><button type="button" class="t" data-cmd="bold" data-tip="Bold — Teks tebal"><b>B</b></button><button type="button" class="t" data-cmd="italic" data-tip="Italic — Teks miring"><i>I</i></button><button type="button" class="t" data-cmd="underline" data-tip="Underline — Garis bawah"><u>U</u></button><div class="color-wrap"><label class="color-control">TEXT<input id="color" class="clr" type="color" value="#000000"></label><label class="color-control">HIGHLIGHT<input id="hilite" class="clr" type="color" value="#ffff00"></label></div><button type="button" class="t wide" id="clear" data-tip="Clear Formatting — Hapus format">Tx Clear</button></div>
<div class="grp" data-group="Paragraph"><button type="button" class="t" data-cmd="justifyLeft">Kiri</button><button type="button" class="t" data-cmd="justifyCenter">Tengah</button><button type="button" class="t" data-cmd="justifyRight">Kanan</button><button type="button" class="t" data-cmd="justifyFull">Rata</button></div>
<div class="grp" data-group="Lists"><button type="button" class="t" data-cmd="insertUnorderedList">• Bullet</button><button type="button" class="t" data-cmd="insertOrderedList">1. Number</button><button type="button" class="t" data-cmd="outdent">← Outdent</button><button type="button" class="t" data-cmd="indent">→ Indent</button></div>
<div class="grp" data-group="Insert"><button type="button" class="t wide" id="link">🔗 Link</button><button type="button" class="t wide" id="image">🖼 Image</button><button type="button" class="t wide" id="table">▦ Table</button></div></div></div><div id="konten" class="body" contenteditable="true" spellcheck="true" data-placeholder="Tulis materi di sini..."></div></div><div class="previewbox"><small style="color:#64748b">LIVE PREVIEW</small><div id="live"></div></div></div>
<div class="full buttons"><button class="btn primary" type="submit">Simpan Materi</button><button class="btn secondary" type="button" id="cancel" hidden>Batal Edit</button></div></form><div id="msg" class="status"></div></section>
<section class="card"><div class="list-head"><h2>Daftar Materi</h2><div class="buttons"><input class="search" id="search" placeholder="Cari judul atau kategori"><button class="btn import" id="oldImport" type="button">Import Materi Lama</button></div></div><div id="list">Memuat...</div></section></main>
<script>
const db=supabaseClient,$=id=>document.getElementById(id),ed=$('konten');let rows=[];marked.setOptions({gfm:true,breaks:true});if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function slugify(v){return String(v||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,90)||('materi-'+Date.now())}
function safeStyleText(s){return String(s||'').replace(/@import[^;]+;?/gi,'').replace(/javascript\s*:/gi,'').replace(/expression\s*\([^)]*\)/gi,'').replace(/behavior\s*:/gi,'').replace(/-moz-binding\s*:/gi,'')}
function sanitize(html){const d=new DOMParser().parseFromString(html||'','text/html');d.querySelectorAll('script,iframe,object,embed,form,link,meta').forEach(e=>e.remove());d.querySelectorAll('*').forEach(e=>{const tag=String(e.tagName||'').toLowerCase();if(tag.includes(':')){e.replaceWith(...Array.from(e.childNodes));return}Array.from(e.attributes).forEach(a=>{const n=a.name.toLowerCase(),v=a.value||'';if(/^on/i.test(n)||n==='srcdoc'||((n==='href'||n==='src')&&/^\s*(javascript:|data:text\/html)/i.test(v))||(n==='style'&&/expression\s*\(|javascript\s*:|behavior\s*:|binding\s*:/i.test(v)))e.removeAttribute(a.name)});if(tag==='img'){e.setAttribute('loading','lazy');e.removeAttribute('srcset')}});d.querySelectorAll('style').forEach(s=>{s.textContent=safeStyleText(s.textContent)});d.querySelectorAll('font').forEach(e=>{const s=document.createElement('span');if(e.face)s.style.fontFamily=e.face;if(e.color)s.style.color=e.color;const m={1:'10px',2:'13px',3:'16px',4:'18px',5:'24px',6:'32px',7:'40px'};if(e.size)s.style.fontSize=m[e.size]||e.size+'px';s.innerHTML=e.innerHTML;e.replaceWith(s)});return d.body.innerHTML}
function content(v){if(!v)return '';return /<\/?(p|div|h[1-6]|ul|ol|li|strong|em|u|s|a|img|blockquote|pre|code|table|span|br|font|style)\b/i.test(v)?sanitize(v):marked.parse(v)}
function preview(){const h=sanitize(ed.innerHTML);$('live').innerHTML=h||'<span style="color:#94a3b8">Preview akan muncul di sini.</span>'}
function focusEd(){ed.focus()}function cmd(c,v=null){focusEd();document.execCommand(c,false,v);preview()}
function styleSel(style){const s=window.getSelection();if(!s||!s.rangeCount||s.isCollapsed){focusEd();return}const r=s.getRangeAt(0),sp=document.createElement('span');Object.assign(sp.style,style);sp.appendChild(r.extractContents());r.insertNode(sp);r.selectNodeContents(sp);s.removeAllRanges();s.addRange(r);preview()}
$('block').onchange=e=>{focusEd();document.execCommand('formatBlock',false,e.target.value);preview()};$('font').onchange=e=>styleSel({fontFamily:e.target.value});$('size').onchange=e=>styleSel({fontSize:e.target.value});$('color').oninput=e=>cmd('foreColor',e.target.value);$('hilite').oninput=e=>cmd('hiliteColor',e.target.value);document.querySelectorAll('[data-cmd]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>cmd(b.dataset.cmd)});$('link').onclick=()=>{const u=prompt('URL tautan:','https://');if(u)cmd('createLink',u)};$('image').onclick=()=>{const u=prompt('URL gambar:','https://');if(u)cmd('insertImage',u)};$('clear').onclick=()=>{cmd('removeFormat');cmd('unlink')};$('table').onclick=()=>{const r=Math.max(1,Math.min(10,Number(prompt('Jumlah baris:','3'))||3)),c=Math.max(1,Math.min(10,Number(prompt('Jumlah kolom:','3'))||3));let h='<table><tbody>';for(let i=0;i<r;i++){h+='<tr>';for(let j=0;j<c;j++)h+=i?'<td>&nbsp;</td>':'<th>&nbsp;</th>';h+='</tr>'}h+='</tbody></table><p><br></p>';focusEd();document.execCommand('insertHTML',false,h);preview()};ed.addEventListener('input',preview);ed.addEventListener('paste',e=>{const cd=e.clipboardData;if(!cd)return;const h=cd.getData('text/html'),t=cd.getData('text/plain');if(h){e.preventDefault();document.execCommand('insertHTML',false,sanitize(h));preview()}else if(t){e.preventDefault();document.execCommand('insertText',false,t);preview()}});
async function importWord(file){const status=$('importStatus');status.textContent='Membaca Word dan mempertahankan layout…';document.body.classList.add('importing');try{const host=document.createElement('div'),styles=document.createElement('div');host.style.position='absolute';host.style.left='-100000px';host.style.top='0';document.body.appendChild(styles);document.body.appendChild(host);await docx.renderAsync(await file.arrayBuffer(),host,styles,{className:'docx-preview',inWrapper:true,breakPages:true,ignoreLastRenderedPageBreak:false,experimental:false});const styleHtml=styles.innerHTML;const bodyHtml=host.innerHTML;host.remove();styles.remove();const html='<div data-import-kind="docx">'+styleHtml+bodyHtml+'</div>';ed.innerHTML=sanitize(html);preview();status.textContent='Word berhasil diimpor dengan layout/style DOCX dipertahankan.'}catch(err){console.error(err);status.textContent='Gagal import Word: '+(err?.message||err);throw err}finally{document.body.classList.remove('importing')}}
async function importPdf(file){const status=$('importStatus');status.textContent='Merender PDF halaman demi halaman…';document.body.classList.add('importing');try{const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const wrapper=document.createElement('div');wrapper.setAttribute('data-import-kind','pdf');for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){status.textContent=`Merender halaman ${pageNo} dari ${pdf.numPages}…`;const page=await pdf.getPage(pageNo);const base=page.getViewport({scale:1});const scale=Math.max(1.6,Math.min(2.4,1200/base.width));const viewport=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);canvas.className='pdf-page';const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport,intent:'display'}).promise;const img=document.createElement('img');img.src=canvas.toDataURL('image/png');img.alt=`Halaman ${pageNo}`;img.className='pdf-page';img.setAttribute('data-pdf-page',String(pageNo));wrapper.appendChild(img)}ed.innerHTML='';ed.appendChild(wrapper);preview();status.textContent=`PDF berhasil diimpor: ${pdf.numPages} halaman. Tampilan asli dipertahankan.`}catch(err){console.error(err);status.textContent='Gagal import PDF: '+(err?.message||err);throw err}finally{document.body.classList.remove('importing')}}
$('importBtn2').onclick=()=>$('importFile').click();$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(/\.pdf$/i.test(f.name)||f.type==='application/pdf')await importPdf(f);else if(/\.docx$/i.test(f.name)||f.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document')await importWord(f);else throw new Error('Gunakan file .docx atau .pdf')}catch(err){}e.target.value=''});$('oldImport').onclick=()=>$('importBtn2').click();
async function requireAdmin(){const {data:{user},error}=await db.auth.getUser();if(error||!user){location.href='login.html';return null}$('user').textContent=user.email||'';const {data,isErr}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(isErr||!data){await db.auth.signOut();location.href='login.html';return null}return user}
async function loadRows(){const {data,error}=await db.from('materi').select('id,judul,deskripsi_singkat,link_halaman,kategori,slug,konten,created_at,updated_at').order('updated_at',{ascending:false});if(error){$('list').innerHTML='<div class="status">Gagal memuat materi: '+esc(error.message)+'</div>';return}rows=data||[];$('total').textContent=rows.length;$('mc').textContent=rows.filter(x=>x.kategori==='Materi').length;$('tc').textContent=rows.filter(x=>x.kategori==='Tutorial').length;renderRows()}
function renderRows(){const q=($('search').value||'').toLowerCase();const a=rows.filter(x=>[x.judul,x.kategori,x.deskripsi_singkat].some(v=>String(v||'').toLowerCase().includes(q)));if(!a.length){$('list').innerHTML='<div class="status">Belum ada materi.</div>';return}$('list').innerHTML=a.map(x=>'<div class="item"><h3>'+esc(x.judul)+'</h3><p>'+esc(x.deskripsi_singkat||'')+'</p><div class="meta">'+esc(x.kategori)+' · '+esc(x.slug||'')+'</div><div class="buttons"><button class="btn edit" onclick="editRow(\''+x.id+'\')">Edit</button><button class="btn preview" onclick="window.open(\'preview.html?id='+encodeURIComponent(x.id)+'\',\'_blank\')">Preview</button><button class="btn delete" onclick="deleteRow(\''+x.id+'\')">Hapus</button></div></div>').join('')}
$('search').oninput=renderRows;window.editRow=id=>{const x=rows.find(r=>r.id===id);if(!x)return;$('id').value=x.id;$('judul').value=x.judul||'';$('kategori').value=x.kategori||'Materi';$('deskripsi').value=x.deskripsi_singkat||'';$('link').value=x.link_halaman||'';ed.innerHTML=content(x.konten||'');preview();$('title').textContent='Edit Materi';$('cancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'})};$('cancel').onclick=()=>{resetForm()};function resetForm(){$('form').reset();$('id').value='';$('kategori').value='Materi';ed.innerHTML='';preview();$('title').textContent='Tambah Materi';$('cancel').hidden=true;$('msg').textContent=''}
window.deleteRow=async id=>{const x=rows.find(r=>r.id===id);if(!x||!confirm('Hapus materi “'+x.judul+'”?'))return;const {error}=await db.from('materi').delete().eq('id',id);if(error){alert(error.message);return}await loadRows()};window.logout=async()=>{await db.auth.signOut();location.href='login.html'};
$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Menyimpan…';const judul=$('judul').value.trim(),id=$('id').value,slug=slugify(judul),payload={judul,deskripsi_singkat:$('deskripsi').value.trim(),link_halaman:$('link').value.trim(),kategori:$('kategori').value,konten:sanitize(ed.innerHTML),slug};let res;if(id)res=await db.from('materi').update(payload).eq('id',id);else res=await db.from('materi').insert(payload);if(res.error){$('msg').textContent='Gagal menyimpan: '+res.error.message;return}$('msg').textContent='Materi berhasil disimpan.';await loadRows();resetForm()};
(async()=>{const u=await requireAdmin();if(u)await loadRows()})();
</script></body></html>
