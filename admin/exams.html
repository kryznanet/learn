<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Ujian — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../shared/auth.js"></script><style>body{font-family:Arial;margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px}button,input,textarea,select{width:100%;padding:10px;margin:5px 0;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:9px}button{background:#2563eb;color:#fff;font-weight:800;border:0;cursor:pointer}.exam{padding:10px;border:1px solid #dbe3ee;border-radius:10px;margin:7px 0;cursor:pointer}.muted{color:#64748b;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class=wrap><a href="dashboard.html">← Dashboard</a><h1>Kelola Ujian & Bank Soal</h1><div class=grid><section class=card><h2>Ujian</h2><div id=e>Memuat...</div></section><section class=card><h2 id=st>Pilih ujian</h2><form id=f hidden><input id=q placeholder="Pertanyaan" required><input id=a placeholder="Pilihan A" required><input id=b placeholder="Pilihan B" required><input id=c placeholder="Pilihan C" required><input id=d placeholder="Pilihan D" required><select id=ok><option>A</option><option>B</option><option>C</option><option>D</option></select><textarea id=x placeholder="Pembahasan"></textarea><button>Tambah soal</button></form><div id=list class=muted>Pilih ujian untuk melihat soal.</div></section></div></main><script>const db=supabaseClient,$=x=>document.getElementById(x);let exam=null;async function boot(){const s=await KryznaAuth.requirePermission('exam.manage',{login:'login.html',denied:'dashboard.html'});if(!s)return;const{data,error}=await db.from('exams').select('id,title,exam_categories(label)').order('title');if(error){$('e').textContent=error.message;return}$('e').innerHTML=(data||[]).map(x=>'<div class=exam data-id='+x.id+'>'+x.exam_categories.label+' · '+x.title+'</div>').join('');document.querySelectorAll('.exam').forEach(x=>x.onclick=()=>select(x.dataset.id))}async function select(id){const{data}=await db.from('exams').select('id,title').eq('id',id).single();exam=data;$('st').textContent=exam.title;$('f').hidden=false;loadQuestions()}async function loadQuestions(){const{data}=await db.from('exam_questions').select('id,question_code,question_text,difficulty,exam_question_options(option_key,option_text)').eq('exam_id',exam.id).order('sort_order');$('list').innerHTML=(data||[]).map(x=>'<div class=exam><b>'+x.question_code+'</b><br>'+esc(x.question_text)+'<br><span class=muted>'+x.difficulty+'</span></div>').join('')||'Belum ada soal.'}$('f').onsubmit=async e=>{e.preventDefault();const opts=[['A',$('a').value],['B',$('b').value],['C',$('c').value],['D',$('d').value]];const{data:q,error}=await db.from('exam_questions').insert({exam_id:exam.id,question_code:crypto.randomUUID(),question_text:$('q').value,explanation:$('x').value,difficulty:'medium',points:1,sort_order:Date.now()}).select('id').single();if(error){alert(error.message);return}const{data:os,error:oe}=await db.from('exam_question_options').insert(opts.map((o,i)=>({question_id:q.id,option_key:o[0],option_text:o[1],sort_order:i+1}))).select('id,option_key');if(oe){alert(oe.message);return}const correct=os.find(o=>o.option_key===$('ok').value);const{error:ke}=await db.from('exam_answer_keys').insert({question_id:q.id,correct_option_id:correct.id});if(ke)alert(ke.message);e.target.reset();loadQuestions()};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}boot()</script></body></html>
