<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Ujian — Kryzna Learn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../shared/auth.js"></script>
<style>body{font-family:Arial;margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:1250px;margin:auto;padding:25px 18px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;margin-bottom:16px}button,input,textarea,select{width:100%;padding:10px;margin:5px 0;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:9px}button{background:#2563eb;color:#fff;font-weight:800;border:0;cursor:pointer}.muted{color:#64748b;font-size:13px;line-height:1.5}.exam,.question{padding:12px;border:1px solid #dbe3ee;border-radius:10px;margin:7px 0}.exam.active{border-color:#2563eb}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{width:auto}.danger{background:#dc2626}.secondary{background:#64748b}.success{background:#15803d}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef3fa;font-size:12px;font-weight:800}.handle{cursor:grab;font-weight:900}@media(max-width:850px){.grid,.row{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><a href="dashboard.html">← Dashboard</a><h1>Kelola Ujian & Bank Soal</h1>
<div class="grid"><section>
<div class="card"><h2>Ujian</h2><button onclick="newExam()">+ Ujian Baru</button><div id="e" class="muted">Memuat...</div></div>
<div class="card"><h2>Kategori Ujian</h2><form id="catForm"><input id="catName" placeholder="Nama kategori" required><input id="catDesc" placeholder="Deskripsi"><button>+ Tambah kategori</button></form><div id="cats" class="muted">Memuat...</div></div>
</section><section>
<div class="card"><h2 id="st">Pilih ujian</h2>
<form id="examForm" hidden><input id="title" placeholder="Judul ujian" required><textarea id="desc" placeholder="Deskripsi"></textarea><div class="row"><input id="duration" type="number" min="1" placeholder="Durasi (menit)" required><input id="passing" type="number" min="0" max="100" placeholder="Nilai lulus" required></div><select id="cat" required></select><label><input id="pub" type="checkbox" style="width:auto"> Terbitkan ujian</label><div class="actions"><button type="submit">Simpan Ujian</button><button type="button" class="secondary" onclick="cancelExam()">Batal</button><button type="button" class="secondary" onclick="toggleArchive()" id="archiveBtn">Arsipkan</button></div></form></div>
<div class="card" id="questionCard" hidden><h2>Bank Soal</h2><form id="qform"><input id="q" placeholder="Pertanyaan" required><div class="row"><input id="a" placeholder="Pilihan A" required><input id="b" placeholder="Pilihan B" required></div><div class="row"><input id="c" placeholder="Pilihan C" required><input id="d" placeholder="Pilihan D" required></div><div class="row"><select id="ok"><option>A</option><option>B</option><option>C</option><option>D</option></select><select id="diff"><option value="easy">Mudah</option><option value="medium" selected>Sedang</option><option value="hard">Sulit</option></select></div><input id="points" type="number" min="1" value="1" placeholder="Poin"><textarea id="x" placeholder="Pembahasan"></textarea><button>+ Tambah Soal</button></form><div id="list" class="muted">Belum ada soal.</div></div></section></div></main>
<script>
const db=supabaseClient,$=x=>document.getElementById(x);let exams=[],categories=[],exam=null,questions=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function boot(){const s=await KryznaAuth.requirePermission('exam.manage',{login:'login.html',denied:'dashboard.html'});if(!s)return;await loadCats();await loadExams()}
async function loadCats(){const{data,error}=await db.from('exam_categories').select('id,name,label,description,sort_order,is_active').order('sort_order');if(error){$('cats').textContent=error.message;return}categories=data||[];$('cat').innerHTML=categories.filter(x=>x.is_active!==false).map(x=>'<option value="'+x.id+'">'+esc(x.label)+'</option>').join('');$('cats').innerHTML=categories.map(x=>'<div class="exam"><b>'+esc(x.label)+'</b><div class="muted">'+esc(x.description||'')+' · '+(x.is_active===false?'Nonaktif':'Aktif')+'</div><div class="actions"><button class="secondary" onclick="editCat(\''+x.id+'\')">Ubah</button><button onclick="toggleCat(\''+x.id+'\','+(x.is_active===false)+')">'+(x.is_active===false?'Aktifkan':'Nonaktifkan')+'</button><button class="danger" onclick="deleteCat(\''+x.id+'\')">Hapus</button></div></div>').join('')||'Belum ada kategori.'}
async function loadExams(){const{data,error}=await db.from('exams').select('id,title,description,duration_minutes,passing_score,is_published,archived_at,category_id,created_by,exam_categories(label)').order('created_at',{ascending:false});if(error){$('e').textContent=error.message;return}exams=data||[];$('e').innerHTML=exams.map(x=>'<div class="exam '+(exam?.id===x.id?'active':'')+'" onclick="selectExam(\''+x.id+'\')"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.exam_categories?.label||'')+' · '+x.duration_minutes+' menit · '+(x.archived_at?'Arsip':x.is_published?'Terbit':'Draft')+'</div></div>').join('')||'<p>Belum ada ujian.</p>'}
function newExam(){exam=null;$('st').textContent='Ujian Baru';$('examForm').hidden=false;$('questionCard').hidden=true;$('archiveBtn').hidden=true;$('title').value='';$('desc').value='';$('duration').value=30;$('passing').value=70;$('cat').value=categories.find(x=>x.is_active!==false)?.id||'';$('pub').checked=false}
function cancelExam(){$('examForm').hidden=true;$('questionCard').hidden=true;$('st').textContent='Pilih ujian';exam=null;loadExams()}
async function selectExam(id){exam=exams.find(x=>x.id===id);if(!exam)return;$('st').textContent=exam.archived_at?'Edit Ujian (Arsip)':'Edit Ujian';$('examForm').hidden=false;$('questionCard').hidden=false;$('archiveBtn').hidden=false;$('archiveBtn').textContent=exam.archived_at?'Aktifkan kembali':'Arsipkan';$('title').value=exam.title;$('desc').value=exam.description||'';$('duration').value=exam.duration_minutes;$('passing').value=exam.passing_score;$('cat').value=exam.category_id;$('pub').checked=!!exam.is_published&&!exam.archived_at;await loadExams();await loadQuestions()}
$('examForm').onsubmit=async e=>{e.preventDefault();const{data:{user}}=await db.auth.getUser();const row={title:$('title').value.trim(),description:$('desc').value.trim(),duration_minutes:Number($('duration').value),passing_score:Number($('passing').value),category_id:$('cat').value,is_published:$('pub').checked,archived_at:exam?.archived_at||null};let r;if(exam)r=await db.from('exams').update(row).eq('id',exam.id);else r=await db.from('exams').insert({...row,created_by:user?.id||null}).select('id').single();if(r.error){alert(r.error.message);return}if(!exam)exam={id:r.data.id};await loadExams();await selectExam(exam.id)}
async function toggleArchive(){if(!exam)return;const{count,error}=await db.from('exam_attempts').select('id',{count:'exact',head:true}).eq('exam_id',exam.id);if(error){alert(error.message);return}const hasAttempts=(count||0)>0; if(!exam.archived_at&&!confirm(hasAttempts?'Ujian memiliki riwayat percobaan. Arsipkan tanpa menghapus riwayat?':'Arsipkan ujian ini?'))return;const r=await db.from('exams').update({archived_at:exam.archived_at?null:new Date().toISOString(),is_published:false}).eq('id',exam.id);if(r.error){alert(r.error.message);return}await loadExams();await selectExam(exam.id)}
async function loadQuestions(){const{data,error}=await db.from('exam_questions').select('id,question_code,question_text,difficulty,points,sort_order,explanation,exam_question_options(id,option_key,option_text,sort_order),exam_answer_keys(correct_option_id)').eq('exam_id',exam.id).order('sort_order');if(error){$('list').textContent=error.message;return}questions=data||[];$('list').innerHTML=questions.map((x,i)=>{const key=x.exam_answer_keys?.[0]?.correct_option_id;const opt=(x.exam_question_options||[]).find(o=>o.id===key);return '<div class="question"><span class="handle">☷</span> <b>'+String(i+1)+'. '+esc(x.question_text)+'</b><div class="muted">Kesulitan: '+esc(x.difficulty)+' · '+x.points+' poin · Jawaban: '+esc(opt?.option_key||'—')+'</div><div class="actions"><button onclick="editQuestion(\''+x.id+'\')">Edit</button><button class="secondary" onclick="moveQuestion(\''+x.id+'\',-1)">↑ Naik</button><button class="secondary" onclick="moveQuestion(\''+x.id+'\',1)">↓ Turun</button><button class="danger" onclick="deleteQuestion(\''+x.id+'\')">Hapus</button></div></div>'}).join('')||'Belum ada soal.'}
function fillQuestion(x){$('q').value=x?.question_text||'';const opts=x?.exam_question_options||[];for(const k of ['A','B','C','D'])$(k.toLowerCase()).value=opts.find(o=>o.option_key===k)?.option_text||'';const correct=(x?.exam_answer_keys||[])[0]?.correct_option_id;$('ok').value=opts.find(o=>o.id===correct)?.option_key||'A';$('diff').value=x?.difficulty||'medium';$('points').value=x?.points||1;$('x').value=x?.explanation||''}
async function editQuestion(id){const x=questions.find(q=>q.id===id);if(!x)return;fillQuestion(x);$('qform').dataset.edit=id;$('qform').querySelector('button').textContent='Simpan Perubahan Soal';window.scrollTo(0,$('questionCard').offsetTop)}
$('qform').onsubmit=async e=>{e.preventDefault();if(!exam)return;const editId=e.target.dataset.edit;const opts=[['A',$('a').value.trim()],['B',$('b').value.trim()],['C',$('c').value.trim()],['D',$('d').value.trim()]];if(editId){const x=questions.find(q=>q.id===editId);const r=await db.from('exam_questions').update({question_text:$('q').value.trim(),explanation:$('x').value.trim(),difficulty:$('diff').value,points:Number($('points').value)}).eq('id',editId);if(r.error){alert(r.error.message);return}for(const [key,text] of opts){const o=(x.exam_question_options||[]).find(v=>v.option_key===key);const rr=await db.from('exam_question_options').update({option_text:text}).eq('id',o.id);if(rr.error){alert(rr.error.message);return}}const correct=(x.exam_question_options||[]).find(o=>o.option_key===$('ok').value);const kr=await db.from('exam_answer_keys').update({correct_option_id:correct.id}).eq('question_id',editId);if(kr.error){alert(kr.error.message);return}delete e.target.dataset.edit;e.target.querySelector('button').textContent='+ Tambah Soal';e.target.reset();$('points').value=1;await loadQuestions();return}const r=await db.from('exam_questions').insert({exam_id:exam.id,question_code:crypto.randomUUID(),question_text:$('q').value.trim(),explanation:$('x').value.trim(),difficulty:$('diff').value,points:Number($('points').value),sort_order:questions.length+1}).select('id').single();if(r.error){alert(r.error.message);return}const os=await db.from('exam_question_options').insert(opts.map((o,i)=>({question_id:r.data.id,option_key:o[0],option_text:o[1],sort_order:i+1}))).select('id,option_key');if(os.error){alert(os.error.message);return}const correct=os.data.find(o=>o.option_key===$('ok').value);const k=await db.from('exam_answer_keys').insert({question_id:r.data.id,correct_option_id:correct.id});if(k.error){alert(k.error.message);return}e.target.reset();$('points').value=1;await loadQuestions()}
async function moveQuestion(id,dir){const i=questions.findIndex(q=>q.id===id),j=i+dir;if(i<0||j<0||j>=questions.length)return;const a=questions[i],b=questions[j];const r1=await db.from('exam_questions').update({sort_order:b.sort_order}).eq('id',a.id);const r2=await db.from('exam_questions').update({sort_order:a.sort_order}).eq('id',b.id);if(r1.error||r2.error){alert((r1.error||r2.error).message);return}await loadQuestions()}
async function deleteQuestion(id){if(!confirm('Hapus soal ini beserta pilihan dan kunci jawabannya?'))return;const{error}=await db.from('exam_questions').delete().eq('id',id);if(error){alert(error.message);return}await loadQuestions()}
async function editCat(id){const x=categories.find(c=>c.id===id);if(!x)return;const label=prompt('Nama kategori:',x.label);if(label===null)return;const description=prompt('Deskripsi:',x.description||'');const{error}=await db.from('exam_categories').update({label:label.trim(),name:label.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''),description:description??x.description}).eq('id',id);if(error){alert(error.message);return}await loadCats()}
async function toggleCat(id,next){const{error}=await db.from('exam_categories').update({is_active:next}).eq('id',id);if(error){alert(error.message);return}await loadCats()}
async function deleteCat(id){const{count,error}=await db.from('exams').select('id',{count:'exact',head:true}).eq('category_id',id);if(error){alert(error.message);return}if(count){alert('Kategori masih digunakan ujian. Nonaktifkan kategori agar riwayat tetap aman.');return}if(!confirm('Hapus kategori?'))return;const r=await db.from('exam_categories').delete().eq('id',id);if(r.error){alert(r.error.message);return}await loadCats()}
$('catForm').onsubmit=async e=>{e.preventDefault();const label=$('catName').value.trim();const name=label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');const{error}=await db.from('exam_categories').insert({name,label,description:$('catDesc').value.trim(),sort_order:categories.length,is_active:true});if(error){alert(error.message);return}e.target.reset();await loadCats()}
boot();
</script></body></html>
