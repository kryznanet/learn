<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Ujian — Kryzna Learn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../shared/auth.js"></script>
<style>body{font-family:Arial;margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:1200px;margin:auto;padding:25px 18px}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;margin-bottom:16px}button,input,textarea,select{width:100%;padding:10px;margin:5px 0;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:9px}button{background:#2563eb;color:#fff;font-weight:800;border:0;cursor:pointer}.muted{color:#64748b;font-size:13px}.exam{padding:12px;border:1px solid #dbe3ee;border-radius:10px;margin:7px 0}.exam.active{border-color:#2563eb}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{width:auto}.danger{background:#dc2626}.secondary{background:#64748b}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:850px){.grid,.row{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><a href="dashboard.html">← Dashboard</a><h1>Kelola Ujian & Bank Soal</h1>
<div class="grid"><section>
<div class="card"><h2>Ujian</h2><button onclick="newExam()">+ Ujian Baru</button><div id="e" class="muted">Memuat...</div></div>
<div class="card"><h2>Kategori Ujian</h2><div id="cats" class="muted">Memuat...</div></div></section>
<section><div class="card"><h2 id="st">Pilih ujian</h2>
<form id="examForm" hidden><input id="title" placeholder="Judul ujian" required><textarea id="desc" placeholder="Deskripsi"></textarea><div class="row"><input id="duration" type="number" min="1" placeholder="Durasi (menit)" required><input id="passing" type="number" min="0" max="100" placeholder="Nilai lulus" required></div><select id="cat" required></select><label><input id="pub" type="checkbox" style="width:auto"> Terbitkan ujian</label><div class="actions"><button type="submit">Simpan Ujian</button><button type="button" class="secondary" onclick="cancelExam()">Batal</button></div></form></div>
<div class="card" id="questionCard" hidden><h2>Bank Soal</h2><form id="qform"><input id="q" placeholder="Pertanyaan" required><div class="row"><input id="a" placeholder="Pilihan A" required><input id="b" placeholder="Pilihan B" required></div><div class="row"><input id="c" placeholder="Pilihan C" required><input id="d" placeholder="Pilihan D" required></div><div class="row"><select id="ok"><option>A</option><option>B</option><option>C</option><option>D</option></select><select id="diff"><option value="easy">Mudah</option><option value="medium" selected>Sedang</option><option value="hard">Sulit</option></select></div><textarea id="x" placeholder="Pembahasan"></textarea><button>+ Tambah Soal</button></form><div id="list" class="muted">Belum ada soal.</div></div></section></div></main>
<script>
const db=supabaseClient,$=x=>document.getElementById(x);let exams=[],categories=[],exam=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function boot(){const s=await KryznaAuth.requirePermission('exam.manage',{login:'login.html',denied:'dashboard.html'});if(!s)return;await loadCats();await loadExams()}
async function loadCats(){const{data,error}=await db.from('exam_categories').select('id,name,label').order('sort_order');if(error){$('cats').textContent=error.message;return}categories=data||[];$('cat').innerHTML=categories.map(x=>'<option value="'+x.id+'">'+esc(x.label)+'</option>').join('');$('cats').innerHTML=categories.map(x=>'<div>'+esc(x.label)+'</div>').join('')}
async function loadExams(){const{data,error}=await db.from('exams').select('id,title,description,duration_minutes,passing_score,is_published,category_id,exam_categories(label)').order('created_at',{ascending:false});if(error){$('e').textContent=error.message;return}exams=data||[];$('e').innerHTML=exams.map(x=>'<div class="exam '+(exam?.id===x.id?'active':'')+'" onclick="selectExam(\''+x.id+'\')"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.exam_categories?.label||'')+' · '+x.duration_minutes+' menit · '+(x.is_published?'Terbit':'Draft')+'</div></div>').join('')||'<p>Belum ada ujian.</p>'}
function newExam(){exam=null;$('st').textContent='Ujian Baru';$('examForm').hidden=false;$('questionCard').hidden=true;$('title').value='';$('desc').value='';$('duration').value=30;$('passing').value=70;$('cat').value=categories[0]?.id||'';$('pub').checked=false}
function cancelExam(){$('examForm').hidden=true;$('questionCard').hidden=true;$('st').textContent='Pilih ujian';exam=null;loadExams()}
async function selectExam(id){exam=exams.find(x=>x.id===id);if(!exam)return;$('st').textContent='Edit Ujian';$('examForm').hidden=false;$('questionCard').hidden=false;$('title').value=exam.title;$('desc').value=exam.description||'';$('duration').value=exam.duration_minutes;$('passing').value=exam.passing_score;$('cat').value=exam.category_id;$('pub').checked=!!exam.is_published;await loadExams();await loadQuestions()}
$('examForm').onsubmit=async e=>{e.preventDefault();const row={title:$('title').value.trim(),description:$('desc').value.trim(),duration_minutes:Number($('duration').value),passing_score:Number($('passing').value),category_id:$('cat').value,is_published:$('pub').checked};let r;if(exam)r=await db.from('exams').update(row).eq('id',exam.id);else r=await db.from('exams').insert(row).select('id').single();if(r.error){alert(r.error.message);return}if(!exam)exam=exams.find(x=>x.id===r.data.id)||{id:r.data.id};await loadExams();if(exam.id)await selectExam(exam.id)}
async function loadQuestions(){const{data,error}=await db.from('exam_questions').select('id,question_code,question_text,difficulty,points,exam_question_options(id,option_key,option_text),exam_answer_keys(correct_option_id)').eq('exam_id',exam.id).order('sort_order');if(error){$('list').textContent=error.message;return}$('list').innerHTML=(data||[]).map((x,i)=>{const key=x.exam_answer_keys?.[0]?.correct_option_id;const opt=(x.exam_question_options||[]).find(o=>o.id===key);return '<div class="exam"><b>'+String(i+1)+'. '+esc(x.question_text)+'</b><div class="muted">Kesulitan: '+esc(x.difficulty)+' · Jawaban: '+esc(opt?.option_key||'—')+'</div><div class="actions"><button class="danger" onclick="deleteQuestion(\''+x.id+'\')">Hapus</button></div></div>'}).join('')||'Belum ada soal.'}
$('qform').onsubmit=async e=>{e.preventDefault();if(!exam)return;const opts=[['A',$('a').value],['B',$('b').value],['C',$('c').value],['D',$('d').value]];const r=await db.from('exam_questions').insert({exam_id:exam.id,question_code:crypto.randomUUID(),question_text:$('q').value.trim(),explanation:$('x').value.trim(),difficulty:$('diff').value,points:1,sort_order:Date.now()}).select('id').single();if(r.error){alert(r.error.message);return}const os=await db.from('exam_question_options').insert(opts.map((o,i)=>({question_id:r.data.id,option_key:o[0],option_text:o[1],sort_order:i+1}))).select('id,option_key');if(os.error){alert(os.error.message);return}const correct=os.data.find(o=>o.option_key===$('ok').value);const k=await db.from('exam_answer_keys').insert({question_id:r.data.id,correct_option_id:correct.id});if(k.error){alert(k.error.message);return}e.target.reset();await loadQuestions()}
async function deleteQuestion(id){if(!confirm('Hapus soal ini beserta pilihan dan kunci jawabannya?'))return;const{error}=await db.from('exam_questions').delete().eq('id',id);if(error){alert(error.message);return}await loadQuestions()}
boot();
</script></body></html>
