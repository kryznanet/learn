<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback Materi — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../shared/auth.js"></script><style>body{font-family:Inter,Arial;background:#f6f8fc;color:#172033;margin:0}.wrap{max-width:1000px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;margin:10px 0}.muted{color:#64748b;font-size:13px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef3ff;color:#1d4ed8;font-weight:800}</style></head><body><main class="wrap"><a href="dashboard.html">← Dashboard</a><h1>⭐ Feedback Materi</h1><p class="muted">Masukan learner untuk membantu review kualitas materi.</p><div id="list">Memuat...</div></main><script>const db=supabaseClient,$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const s=await KryznaAuth.requirePermission('content.read',{login:'login.html',denied:'dashboard.html'});if(!s)return;const{data,error}=await db.from('materi_feedback').select('rating,comment,created_at,materi:materi_id(judul,kategori)').order('created_at',{ascending:false});if(error){$('list').textContent='Gagal: '+error.message;return}$('list').innerHTML=(data||[]).map(x=>'<article class="card"><span class="badge">'+esc(x.rating)+'/5</span><h2>'+esc(x.materi?.judul||'Materi')+'</h2><div class="muted">'+esc(x.materi?.kategori||'')+' · '+new Date(x.created_at).toLocaleString('id-ID')+'</div><p>'+esc(x.comment||'Tidak ada komentar.')+'</p></article>').join('')||'<div class="card">Belum ada feedback.</div>'}load()</script></body></html>
