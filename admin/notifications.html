<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Notifikasi — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../shared/auth.js"></script><style>body{font-family:Inter,Arial;background:#f6f8fc;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid #cbd5e1;border-radius:9px}.btn{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.muted{color:#64748b;font-size:13px}</style></head><body><main class="wrap"><a href="dashboard.html">← Dashboard</a><h1>🔔 Kelola Notifikasi</h1><section class="card"><p class="muted">Kirim notifikasi internal ke satu pengguna atau semua pengguna belajar aktif.</p><label>Judul<input id="title" required></label><label>Pesan<textarea id="body" rows="4"></textarea></label><label>Penerima<select id="target"><option value="all">Semua pengguna belajar aktif</option></select></label><button id="send" class="btn">Kirim Notifikasi</button><div id="msg" class="muted"></div></section></main><script>const db=supabaseClient,$=x=>document.getElementById(x);let learners=[];async function boot(){const s=await KryznaAuth.requirePermission('notifications.manage',{login:'login.html',denied:'dashboard.html'});if(!s)return;const{data,error}=await db.functions.invoke('manage-users',{body:{action:'list'}});if(error){$('msg').textContent=error.message;return}learners=(data.users||[]).filter(x=>x.active);$('target').innerHTML='<option value="all">Semua pengguna belajar aktif ('+learners.length+')</option>'+learners.map(x=>'<option value="'+x.user_id+'">'+String(x.display_name||x.email).replace(/[&<>"']/g,'')+'</option>').join('')}$('send').onclick=async()=>{const title=$('title').value.trim(),body=$('body').value.trim(),target=$('target').value;if(!title){$('msg').textContent='Judul wajib diisi.';return}const rows=(target==='all'?learners:learners.filter(x=>x.user_id===target)).map(x=>({user_id:x.user_id,title,body}));if(!rows.length){$('msg').textContent='Tidak ada penerima.';return}const{error}=await db.from('learner_notifications').insert(rows);$('msg').textContent=error?'Gagal: '+error.message:'Notifikasi berhasil dikirim ke '+rows.length+' pengguna.';if(!error){$('title').value='';$('body').value=''}};boot()</script></body></html>
