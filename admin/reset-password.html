<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password — Kryzna Learn</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef5ff;
        font-family: Segoe UI, Arial, sans-serif;
        color: #0f172a;
      }

      .card {
        width: min(430px, calc(100% - 32px));
        background: #fff;
        border: 1px solid #dbe3ee;
        border-radius: 20px;
        padding: 26px;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin: 0 0 8px;
      }

      p {
        color: #64748b;
        font-size: 13px;
        line-height: 1.6;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 800;
        margin: 14px 0 6px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
      }

      .btn {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font-weight: 900;
        cursor: pointer;
      }

      .msg {
        margin-top: 12px;
        font-size: 13px;
        min-height: 20px;
      }

      .back {
        display: block;
        text-align: center;
        margin-top: 14px;
        color: #2563eb;
        text-decoration: none;
        font-weight: 800;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>🔐 Reset Password</h1>
      <p>Buat password baru untuk akun Kryzna Learn.</p>

      <label>Password Baru</label>
      <input
        id="p1"
        type="password"
        minlength="8"
        autocomplete="new-password"
      />

      <label>Ulangi Password</label>
      <input
        id="p2"
        type="password"
        minlength="8"
        autocomplete="new-password"
      />

      <button class="btn" id="save">Simpan Password</button>
      <div class="msg" id="msg"></div>

      <a class="back" href="login.html">← Kembali ke login</a>
    </section>

    <script>
      const db = supabaseClient;
      const $ = (id) => document.getElementById(id);

      $("save").onclick = async () => {
        const a = $("p1").value;
        const b = $("p2").value;

        if (a.length < 8) {
          $("msg").textContent = "Password minimal 8 karakter.";
          return;
        }

        if (a !== b) {
          $("msg").textContent = "Konfirmasi password tidak sama.";
          return;
        }

        $("save").disabled = true;
        $("msg").textContent = "Menyimpan...";

        const { error } = await db.auth.updateUser({ password: a });

        if (error) {
          $("msg").textContent = error.message;
          $("save").disabled = false;
          return;
        }

        $("msg").textContent =
          "Password berhasil diubah. Mengarahkan ke login...";

        setTimeout(async () => {
          await db.auth.signOut();
          location.href = "login.html";
        }, 900);
      };
    </script>
  </body>
</html>
