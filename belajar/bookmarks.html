<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmark Materi — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>body{font-family:Inter,Arial;background:#f6f8fc;color:#172033;margin:0}.wrap{max-width:950px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;margin:10px 0}.btn{display:inline-block;background:#2563eb;color:#fff;padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:800}.muted{color:#64748b;font-size:13px}.empty{text-align:center;padding:40px}</style></head><body><main class="wrap"><a href="index.html">← Belajar Saya</a><h1>🔖 Bookmark Materi</h1><p class="muted">Materi yang Anda simpan untuk dipelajari kembali.</p><div id="list">Memuat...</div></main><script>const db=supabaseClient,$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data,error}=await db.from('materi_bookmarks').select('id,created_at,materi:materi_id(id,judul,slug,deskripsi_singkat,kategori,status)').eq('user_id',user.id).order('created_at',{ascending:false});if(error){$('list').textContent='Gagal memuat: '+error.message;return}const rows=(data||[]).filter(x=>x.materi?.status==='published');$('list').innerHTML=rows.map(x=>'<article class="card"><div class="muted">'+esc(x.materi.kategori||'Umum')+'</div><h2>'+esc(x.materi.judul)+'</h2><p class="muted">'+esc(x.materi.deskripsi_singkat||'')+'</p><a class="btn" href="../materi/view.html?slug='+encodeURIComponent(x.materi.slug)+'">Buka Materi</a></article>').join('')||'<div class="card empty">Belum ada bookmark.</div>'}load()</script></body></html>
