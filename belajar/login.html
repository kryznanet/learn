<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #dbe3ee;border-radius:20px;padding:28px;width:min(420px,90%);box-shadow:0 15px 45px #0f172a12}h1{margin-top:0}input,button{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #cbd5e1;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;font-weight:800;cursor:pointer}.msg{min-height:24px;color:#b91c1c;font-size:13px}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:13px}</style></head><body><main class="box"><h1>Akun Belajar</h1><p>Masuk atau buat akun untuk menyimpan riwayat materi dan hasil ujian.</p><form id=f><input id=e type=email placeholder="Email" required autocomplete=username><input id=p type=password placeholder="Password minimal 6 karakter" required autocomplete=current-password><button>Masuk</button></form><button id=s type=button>Daftar akun</button><div id=m class=msg></div><div class=links><a href="../index.html">Website</a><a href="riwayat.html">Riwayat belajar</a><a href="../ujian/index.html">Ujian online</a></div></main><script>const db=supabaseClient,$=x=>document.getElementById(x);async function route(){const{data:{user}}=await db.auth.getUser();if(user)location.href='index.html'}$('f').onsubmit=async e=>{e.preventDefault();$('m').textContent='Memproses...';const{error}=await db.auth.signInWithPassword({email:$('e').value.trim(),password:$('p').value});$('m').textContent=error?error.message:'';if(!error)route()};$('s').onclick=async()=>{const{error}=await db.auth.signUp({email:$('e').value.trim(),password:$('p').value});$('m').textContent=error?error.message:'Akun dibuat. Jika email confirmation aktif, cek email sebelum masuk.'};route()</script></body></html>
