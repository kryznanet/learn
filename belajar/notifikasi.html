<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifikasi — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>body{font-family:Inter,Arial;background:#f6f8fc;color:#172033;margin:0}.wrap{max-width:850px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;margin:10px 0}.unread{border-left:4px solid #2563eb}.btn{display:inline-block;background:#2563eb;color:#fff;padding:9px 12px;border-radius:9px;border:0;font-weight:800;cursor:pointer}.muted{color:#64748b;font-size:13px}.empty{text-align:center;padding:40px}</style></head><body><main class="wrap"><a href="index.html">← Belajar Saya</a><h1>🔔 Notifikasi</h1><p class="muted">Informasi yang dikirim ke akun belajar Anda.</p><div id="list">Memuat...</div></main><script>const db=supabaseClient,$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data,error}=await db.from('learner_notifications').select('id,title,body,read_at,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(error){$('list').textContent='Gagal memuat: '+error.message;return}$('list').innerHTML=(data||[]).map(x=>'<article class="card '+(!x.read_at?'unread':'')+'"><h2>'+esc(x.title)+'</h2><p>'+esc(x.body)+'</p><div class="muted">'+new Date(x.created_at).toLocaleString('id-ID')+'</div>'+(!x.read_at?'<button class="btn" onclick="readOne(\''+x.id+'\')">Tandai sudah dibaca</button>':'')+'</article>').join('')||'<div class="card empty">Belum ada notifikasi.</div>'}async function readOne(id){const{error}=await db.from('learner_notifications').update({read_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}load()}load()</script></body></html>
