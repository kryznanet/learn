<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Belajar — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>body{font-family:Arial;margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:16px;margin:10px 0}.badge{padding:5px 9px;border-radius:99px;background:#e8f1ff;color:#1d4ed8;font-size:12px;font-weight:800}.muted{color:#64748b;font-size:13px}.btn{display:inline-block;padding:9px 12px;border-radius:9px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800}</style></head><body><main class=wrap><a href="../index.html">← Website</a><h1>Riwayat Belajar</h1><p class=muted>Materi yang pernah Anda buka tersimpan di akun ini.</p><div id=a>Memuat...</div></main><script>const db=supabaseClient,$=x=>document.getElementById(x);async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data,error}=await db.from('material_reading_history').select('id,status,first_read_at,last_read_at,visit_count,materi(id,judul,kategori,slug)').order('last_read_at',{ascending:false});if(error){$('a').textContent=error.message;return}if(!data?.length){$('a').innerHTML='<div class=card>Belum ada materi yang dibaca.</div>';return}$('a').innerHTML=data.map(x=>'<article class=card><span class=badge>'+x.materi.kategori+'</span><h2>'+esc(x.materi.judul)+'</h2><p class=muted>'+ (x.status==='completed'?'Selesai dibaca':'Sedang dipelajari')+' · Dibuka '+x.visit_count+' kali · Terakhir '+new Date(x.last_read_at).toLocaleString('id-ID')+'</p><a class=btn href="../materi/view.html?slug='+encodeURIComponent(x.materi.slug)+'">Buka materi</a></article>').join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load()</script></body></html>
