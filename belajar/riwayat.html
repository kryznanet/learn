<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Belajar — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>:root{--bg:#f6f8fc;--card:#fff;--line:#dbe3ee;--text:#172033;--muted:#64748b;--primary:#2563eb;--soft:#eef3fa}*{box-sizing:border-box}body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}.wrap{max-width:1000px;margin:auto;padding:28px 18px}.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav a{color:#1d4ed8;font-weight:800;text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin:10px 0}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e8f1ff;color:#1d4ed8;font-size:12px;font-weight:800}.done{background:#dcfce7;color:#166534}.muted{color:var(--muted);font-size:13px;line-height:1.6}.btn{display:inline-block;padding:9px 12px;border-radius:9px;background:var(--primary);color:#fff;text-decoration:none;font-weight:800}.filters{display:flex;gap:9px;margin:18px 0;flex-wrap:wrap}.filters input,.filters select{padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.empty{text-align:center;padding:30px}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}@media(max-width:560px){.filters>*{width:100%}}</style></head><body><main class="wrap"><div class="nav"><a href="index.html">← Belajar Saya</a><a href="../ujian/index.html">Ujian Online →</a></div><h1>Riwayat Belajar</h1><p class="muted">Materi hanya tercatat sebagai selesai setelah Anda mencapai bagian paling bawah dan melakukan konfirmasi.</p><div class="filters"><input id="search" type="search" placeholder="Cari judul materi…" aria-label="Cari judul materi"><select id="status" aria-label="Filter status"><option value="all">Semua status</option><option value="completed">Selesai dibaca</option></select></div><div id="a">Memuat...</div></main><script>const db=supabaseClient,$=x=>document.getElementById(x);let rows=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){const q=$('search').value.trim().toLowerCase(),s=$('status').value;const data=rows.filter(x=>(s==='all'||x.status===s)&&(!q||String(x.materi?.judul||'').toLowerCase().includes(q)));if(!data.length){$('a').innerHTML='<div class="card empty">'+(rows.length?'Tidak ada materi yang cocok dengan filter.':'Belum ada materi yang ditandai selesai.')+'</div>';return}$('a').innerHTML=data.map(x=>'<article class="card"><div class="meta"><span class="badge">'+esc(x.materi?.kategori||'Materi')+'</span>'+(x.status==='completed'?'<span class="badge done">Selesai dibaca</span>':'')+'</div><h2>'+esc(x.materi?.judul||'Materi')+'</h2><p class="muted">Terakhir dibuka '+new Date(x.last_read_at).toLocaleString('id-ID')+'</p><a class="btn" href="../materi/view.html?slug='+encodeURIComponent(x.materi?.slug||'')+'">Buka materi</a></article>').join('')}async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data,error}=await db.from('material_reading_history').select('id,status,last_read_at,materi(id,judul,kategori,slug)').order('last_read_at',{ascending:false});if(error){$('a').textContent='Gagal memuat riwayat: '+error.message;return}rows=data||[];render()}$('search').oninput=render;$('status').onchange=render;load()</script>  <script src="../shared/ui.js"></script>\n</body></html>
