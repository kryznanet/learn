<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sertifikat Kelulusan — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>body{font-family:Georgia,serif;background:#eef2f7;margin:0;color:#172033}.wrap{max-width:1000px;margin:30px auto;padding:18px}.certificate{background:#fff;border:12px double #1d4ed8;padding:60px 50px;text-align:center;min-height:560px;box-shadow:0 15px 50px #0f172a18}.brand{font-family:Arial;font-weight:900;color:#1d4ed8;letter-spacing:2px}.name{font-size:42px;margin:25px 0;font-weight:700}.title{font-size:28px}.muted{font-family:Arial;color:#64748b;font-size:13px}.code{font-family:monospace;font-size:12px}.btn{font-family:Arial;background:#2563eb;color:#fff;border:0;padding:11px 15px;border-radius:9px;font-weight:800;cursor:pointer;margin:10px}.actions{text-align:center}@media print{body{background:#fff}.wrap{margin:0;max-width:none}.actions{display:none}.certificate{box-shadow:none;min-height:80vh}}</style></head><body><main class="wrap"><div id="app">Memuat...</div></main><script>const db=supabaseClient,$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const id=new URLSearchParams(location.search).get('attempt');if(!id){$('app').textContent='ID kelulusan tidak ditemukan.';return}const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data,error}=await db.functions.invoke('exam-api',{body:{action:'result',attemptId:id}});if(error){$('app').textContent='Gagal memuat: '+error.message;return}const a=data.attempt;if(!a.passed){$('app').innerHTML='<div class="certificate"><h1>Belum tersedia</h1><p>Dokumen kelulusan hanya tersedia untuk attempt yang berstatus lulus.</p><a href="ujian-riwayat.html">Kembali</a></div>';return}const name=user.user_metadata?.display_name||user.email||'Peserta';const date=new Date(a.submittedAt||Date.now()).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});$('app').innerHTML='<section class="certificate"><div class="brand">KRYZNA LEARN</div><div class="muted">BUKTI KELULUSAN PEMBELAJARAN</div><h1 class="title">Sertifikat Kelulusan</h1><p>Diberikan kepada</p><div class="name">'+esc(name)+'</div><p>telah menyelesaikan ujian dan dinyatakan <b>LULUS</b>.</p><h2>'+esc(data.exam?.title||'Ujian Online')+'</h2><p>Nilai <b>'+esc(a.score)+'</b> · Nilai lulus '+esc(a.passingScore)+' · '+esc(a.correctCount)+' dari '+esc(a.totalQuestions)+' benar</p><p class="muted">Tanggal kelulusan: '+date+'</p><p class="code">Kode bukti: '+esc(a.id)+'</p></section><div class="actions"><button class="btn" onclick="window.print()">🖨️ Cetak / Simpan PDF</button><a class="btn" href="ujian-riwayat.html">Kembali ke Riwayat</a></div>'}load()</script></body></html>
