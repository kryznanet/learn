<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Hasil Ujian — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>body{font-family:Inter,Segoe UI,Arial,sans-serif;background:#f6f8fc;color:#172033;margin:0}.wrap{max-width:980px;margin:auto;padding:28px 18px}.back{display:inline-block;margin-bottom:8px;color:#2563eb;font-weight:800;text-decoration:none}.result{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 24px #0f172a08}.score{font-size:42px;font-weight:900;line-height:1}.pass{color:#166534}.fail{color:#b91c1c}.option{padding:10px;border:1px solid #dbe3ee;border-radius:9px;margin:6px 0}.correct{border-color:#86efac;background:#f0fdf4}.wrong{border-color:#fca5a5;background:#fef2f2}.btn{display:inline-block;background:#2563eb;color:#fff;padding:10px 13px;border-radius:10px;text-decoration:none;font-weight:800;margin:4px}.muted{color:#64748b;font-size:13px;line-height:1.6}@media(max-width:600px){.wrap{padding:20px 12px}.result{padding:16px}.score{font-size:36px}}</style></head><body><main class="wrap"><a href="ujian-riwayat.html">← Riwayat Ujian</a><h1>Detail Hasil Ujian</h1><div id="app">Memuat...</div></main><script>const db=supabaseClient,$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const id=new URLSearchParams(location.search).get('attempt');if(!id){$('app').textContent='ID percobaan tidak ditemukan.';return}const{data,error}=await db.functions.invoke('exam-api',{body:{action:'result',attemptId:id}});if(error){$('app').textContent='Gagal memuat hasil: '+error.message;return}const a=data.attempt;$('app').innerHTML='<section class="card"><h2>Nilai '+esc(a.score??'—')+'</h2><p class="muted">'+esc(a.correctCount)+' dari '+esc(a.totalQuestions)+' benar · Nilai lulus '+esc(a.passingScore)+' · '+(a.passed?'Lulus':'Belum lulus')+'</p></section>'+(data.questions||[]).map((q,i)=>'<article class="card '+(q.isCorrect?'ok':'bad')+'"><b>'+(i+1)+'. '+esc(q.text)+'</b><div class="muted">Jawaban Anda: '+esc(q.selectedKey||'Tidak dijawab')+' · Kunci: '+esc(q.correctKey||'—')+'</div>'+(q.options||[]).map(o=>'<div class="option '+(o.id===q.correctOptionId?'correct ':'')+(o.id===q.selectedOptionId&&!q.isCorrect?'wrong ':'')+'">'+esc(o.key)+'. '+esc(o.text)+'</div>').join('')+(q.explanation?'<p class="muted"><b>Pembahasan:</b> '+esc(q.explanation)+'</p>':'')+'</article>').join('')+'(a.passed?'<a class="btn" href="sertifikat.html?attempt='+encodeURIComponent(a.id)+'">Sertifikat Kelulusan</a>':'')+'<a class="btn" href="ujian-riwayat.html">Kembali ke riwayat</a>'}load()</script></body></html>
