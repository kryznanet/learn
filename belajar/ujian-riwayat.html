<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Ujian — Kryzna Learn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../shared/auth.js"></script>
<style>body{font-family:Arial;margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.top{display:flex;justify-content:space-between;gap:12px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;margin:12px 0}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e8f1ff;color:#1d4ed8;font-size:12px;font-weight:800}.pass{background:#dcfce7;color:#166534}.fail{background:#fee2e2;color:#991b1b}.muted{color:#64748b;font-size:13px}.btn{display:inline-block;padding:9px 12px;border-radius:9px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800}</style></head>
<body><main class="wrap"><div class="top"><a href="index.html">← Belajar Saya</a><a class="btn" href="../ujian/index.html">Ujian Online</a></div><h1>Riwayat Ujian</h1><p class="muted">Riwayat percobaan ujian yang terkait dengan akun Anda.</p><div id="list">Memuat...</div></main>
<script>
const db=supabaseClient,$=x=>document.getElementById(x);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data,error}=await db.from('exam_attempts').select('id,started_at,submitted_at,score,correct_count,total_questions,passed,status,exams(title,exam_categories(label))').order('started_at',{ascending:false});if(error){$('list').textContent='Gagal memuat riwayat: '+error.message;return}if(!data?.length){$('list').innerHTML='<div class="card">Belum ada percobaan ujian.</div>';return}$('list').innerHTML=data.map(x=>{const ex=Array.isArray(x.exams)?x.exams[0]:x.exams;const cat=ex?.exam_categories?(Array.isArray(ex.exam_categories)?ex.exam_categories[0]:ex.exam_categories):null;return '<article class="card"><span class="badge">'+esc(cat?.label||'Ujian')+'</span><h2>'+esc(ex?.title||'Ujian')+'</h2><p class="muted">'+new Date(x.started_at).toLocaleString('id-ID')+' · Status: '+esc(x.status)+'</p><p><b>Nilai: '+(x.score??'—')+'</b> · '+(x.correct_count??0)+' dari '+(x.total_questions??0)+' benar '+(x.passed?'<span class="badge pass">Lulus</span>':'<span class="badge fail">Belum lulus</span>')+'</p></article>'}).join('')}
load();
</script></body></html>
