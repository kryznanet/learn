<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Ujian — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>:root{--bg:#f6f8fc;--card:#fff;--line:#dbe3ee;--text:#172033;--muted:#64748b;--primary:#2563eb;--soft:#eef3fa}*{box-sizing:border-box}body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}.wrap{max-width:1000px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.top a{color:#1d4ed8;font-weight:800;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e8f1ff;color:#1d4ed8;font-size:12px;font-weight:800}.pass{background:#dcfce7;color:#166534}.fail{background:#fee2e2;color:#991b1b}.muted{color:var(--muted);font-size:13px;line-height:1.6}.filters{display:flex;gap:9px;margin:18px 0;flex-wrap:wrap}.filters input,.filters select{padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.filters input{flex:1;min-width:220px}.summary{display:flex;gap:10px;flex-wrap:wrap}.summary .card{margin:0;min-width:150px;flex:1}.num{font-size:24px;font-weight:900}.btn{display:inline-block;padding:9px 12px;border-radius:9px;background:var(--primary);color:#fff;text-decoration:none;font-weight:800}.empty{text-align:center;padding:30px}@media(max-width:560px){.filters input,.filters select{width:100%}}</style></head><body><main class="wrap"><div class="top"><a href="index.html">← Belajar Saya</a><a href="../ujian/index.html">Ujian Online →</a></div><h1>Riwayat Ujian</h1><p class="muted">Riwayat percobaan ujian yang terkait dengan akun Anda.</p><div class="summary"><div class="card"><div class="num" id="total">—</div><div class="muted">Total percobaan</div></div><div class="card"><div class="num" id="passed">—</div><div class="muted">Lulus</div></div></div><div class="filters"><input id="search" type="search" placeholder="Cari nama ujian…" aria-label="Cari nama ujian"><select id="status" aria-label="Filter hasil"><option value="all">Semua hasil</option><option value="passed">Lulus</option><option value="failed">Belum lulus</option></select></div><div id="list">Memuat...</div></main><script>const db=supabaseClient,$=x=>document.getElementById(x);let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function render(){const q=$('search').value.trim().toLowerCase(),s=$('status').value;const data=rows.filter(x=>{const ex=Array.isArray(x.exams)?x.exams[0]:x.exams;return(s==='all'||(s==='passed'?x.passed===true:x.passed!==true))&&(!q||String(ex?.title||'').toLowerCase().includes(q))});if(!data.length){$('list').innerHTML='<div class="card empty">'+(rows.length?'Tidak ada riwayat yang cocok dengan filter.':'Belum ada percobaan ujian.')+'</div>';return}$('list').innerHTML=data.map(x=>{const ex=Array.isArray(x.exams)?x.exams[0]:x.exams;const cat=ex?.exam_categories?(Array.isArray(ex.exam_categories)?ex.exam_categories[0]:ex.exam_categories):null;return '<article class="card"><span class="badge">'+esc(cat?.label||'Ujian')+'</span> '+(x.passed?'<span class="badge pass">Lulus</span>':'<span class="badge fail">Belum lulus</span>')+'<h2>'+esc(ex?.title||'Ujian')+'</h2><p class="muted">'+new Date(x.started_at).toLocaleString('id-ID')+' · Status: '+esc(x.status)+'</p><p><b>Nilai: '+(x.score??'—')+'</b> · '+(x.correct_count??0)+' dari '+(x.total_questions??0)+' benar</p><a class="btn" href="ujian-hasil.html?attempt='+encodeURIComponent(x.id)+'">Detail hasil</a></article>'}).join('')}async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data,error}=await db.from('exam_attempts').select('id,started_at,submitted_at,score,correct_count,total_questions,passed,status,exams(title,exam_categories(label))').order('started_at',{ascending:false});if(error){$('list').textContent='Gagal memuat riwayat: '+error.message;return}rows=data||[];$('total').textContent=rows.length;$('passed').textContent=rows.filter(x=>x.passed===true).length;render()}$('search').oninput=render;$('status').onchange=render;load()</script>  <script src="../shared/ui.js"></script>\n</body></html>
