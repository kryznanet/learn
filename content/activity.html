<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Activity Log — Kryzna Learn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e2e8f0;--text:#172033;--muted:#64748b;--primary:#2563eb;--soft:#eff6ff;--shadow:0 12px 35px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.top{background:#0f172a;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.top a,.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;text-decoration:none}.top a{background:#ffffff14;color:#fff;border:1px solid #ffffff22}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.filter{display:grid;grid-template-columns:1fr 170px;gap:10px;margin-top:14px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.item{border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:10px}.badge{font-size:11px;font-weight:900;color:#1d4ed8;background:var(--soft);border-radius:999px;padding:5px 8px}.meta{color:var(--muted);font-size:12px;margin-top:5px}.detail{font-size:13px;margin-top:8px;overflow-wrap:anywhere}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:700px){.filter{grid-template-columns:1fr}}
</style>
</head>
<body><header class="top"><div><b>📚 Kryzna Learn</b><div class="muted" style="color:#94a3b8">Content Activity Log</div></div><div><a href="index.html">← Kelola Konten</a></div></header>
<main class="wrap"><section class="card"><div class="head"><div><h1 style="margin:0">📝 Aktivitas Konten</h1><div class="muted">Riwayat perubahan yang berkaitan dengan materi.</div></div></div><div class="filter"><input id="q" placeholder="Cari aktivitas materi..."><select id="limit"><option value="50">50 aktivitas</option><option value="100">100 aktivitas</option><option value="200">200 aktivitas</option></select></div></section><section class="card"><div id="list" class="empty">Memuat...</div></section></main>
<script>
const db=supabaseClient,$=id=>document.getElementById(id);let all=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function boot(){const {data:{user},error}=await db.auth.getUser();if(error||!user){location.href='../admin/login.html';return}const {data:r}=await db.from('admin_users').select('role,active').eq('user_id',user.id).maybeSingle();if(!r?.active||!['penulis','editor','admin','super_admin'].includes(r.role)){document.querySelector('main').innerHTML='<section class="card"><h2>Akses ditolak</h2><p class="muted">Anda belum memiliki akses ke log konten.</p></section>';return}load()}
async function load(){const {data,error}=await db.from('activity_logs').select('*').order('created_at',{ascending:false}).limit(Number($('limit').value));if(error){$('list').textContent='Gagal memuat: '+error.message;return}all=(data||[]).filter(x=>{const s=JSON.stringify(x).toLowerCase();return s.includes('materi')||s.includes('content')||s.includes('created')||s.includes('updated')||s.includes('deleted')});render()}
function render(){const q=$('q').value.trim().toLowerCase();const rows=all.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));$('list').innerHTML=rows.map(x=>`<article class="item"><div class="row"><div><b>${esc(x.title||x.entity_type||'Aktivitas materi')}</b><div class="meta">${new Date(x.created_at).toLocaleString('id-ID')} · ${esc(x.user_email||'User')}</div></div><span class="badge">${esc(x.action||'aktivitas')}</span></div><div class="detail">${esc(x.detail||x.entity_id||'')}</div></article>`).join('')||'<div class="empty">Belum ada aktivitas konten yang tercatat.</div>'}
$('q').oninput=render;$('limit').onchange=load;boot();
</script></body></html>
