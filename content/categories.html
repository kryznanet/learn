<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kategori Materi — Kryzna Learn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../shared/auth.js"></script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e2e8f0;--text:#172033;--muted:#64748b;--primary:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.top{background:#0f172a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top a,.btn{padding:9px 12px;border-radius:9px;text-decoration:none;border:0;font-weight:800}.top a{background:#ffffff14;color:#fff}.wrap{max-width:900px;margin:auto;padding:26px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.row{display:flex;gap:8px}.btn{cursor:pointer;background:#e2e8f0;color:#1e293b}.primary{background:var(--primary);color:#fff}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-main{min-width:0}.muted{color:var(--muted);font-size:13px}.msg{margin-top:10px;padding:10px;border-radius:9px;background:#eff6ff;color:#1e40af}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.small{padding:7px 9px;font-size:12px}.danger{background:#fee2e2;color:#991b1b}.off{opacity:.7}@media(max-width:650px){.row{flex-direction:column}.item{grid-template-columns:1fr}.actions{justify-content:flex-start}}
</style></head>
<body><header class="top"><div><b>📚 Kryzna Learn</b><div style="font-size:11px;color:#94a3b8">Kelola Materi · Kategori Materi</div></div><a href="index.html">← Kelola Materi</a></header>
<main class="wrap"><section class="card"><h1 style="margin:0 0 6px">Kategori Materi</h1><p class="muted">Tambah, ubah nama, aktifkan/nonaktifkan, dan hapus kategori yang tidak digunakan.</p></section>
<section class="card" id="manager" hidden><form id="form"><label for="name">Nama kategori baru</label><div class="row"><input id="name" maxlength="80" required placeholder="Contoh: Praktik Lab"><button class="btn primary" type="submit">+ Tambah Kategori</button></div></form><div id="msg"></div></section>
<section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 style="margin:0">Semua kategori</h2><div id="count" class="muted">Memuat…</div></div><button class="btn small" id="refresh" type="button">↻ Refresh</button></div><div id="list" class="muted" style="margin-top:12px">Memuat…</div></section></main>
<script>
const db=supabaseClient,$=id=>document.getElementById(id);let session=null,categories=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function canManage(){return KryznaAuth.hasPermission('content.manage_categories',session?.permissions)}
function message(text){$('msg').className='msg';$('msg').textContent=text}
async function load(){const{data,error}=await db.from('materi_categories').select('id,name,is_active,created_at').order('name',{ascending:true});if(error){$('list').textContent='Gagal memuat kategori: '+error.message;return}categories=data||[];$('count').textContent=categories.length+' kategori';render()}
function render(){if(!categories.length){$('list').textContent='Belum ada kategori.';return}$('list').innerHTML=categories.map(x=>`<div class="item ${x.is_active?'':'off'}"><div class="item-main"><b>${esc(x.name)}</b><div class="muted">${x.is_active?'Aktif — tersedia di editor materi':'Nonaktif — tidak muncul di pilihan editor'} · dibuat ${new Date(x.created_at).toLocaleDateString('id-ID')}</div></div><div class="actions"><button class="btn small" onclick="renameCategory('${x.id}')">✏️ Ubah</button><button class="btn small" onclick="toggleCategory('${x.id}',${x.is_active})">${x.is_active?'Nonaktifkan':'Aktifkan'}</button><button class="btn small danger" onclick="deleteCategory('${x.id}')">Hapus</button></div></div>`).join('')}
async function renameCategory(id){const item=categories.find(x=>x.id===id);if(!item)return;const usage=await db.from('materi').select('id',{count:'exact',head:true}).eq('kategori',item.name);if(usage.error){alert('Tidak dapat memeriksa penggunaan kategori: '+usage.error.message);return}if((usage.count||0)>0){alert('Kategori masih digunakan oleh '+usage.count+' materi. Untuk menjaga referensi materi tetap konsisten, nonaktifkan kategori ini dan buat kategori baru.');return}const name=prompt('Nama kategori baru:',item.name);if(name===null)return;const value=name.trim();if(value.length<2){alert('Nama kategori minimal 2 karakter.');return}if(!canManage()){alert('Anda tidak memiliki permission.');return}const{error}=await db.from('materi_categories').update({name:value}).eq('id',id);if(error){alert(error.code==='23505'?'Kategori tersebut sudah ada.':error.message);return}await load()}
async function toggleCategory(id,current){if(!canManage()){alert('Anda tidak memiliki permission.');return}const{error}=await db.from('materi_categories').update({is_active:!current}).eq('id',id);if(error){alert(error.message);return}await load()}
async function deleteCategory(id){const item=categories.find(x=>x.id===id);if(!item||!canManage())return;const used=await db.from('materi').select('id',{count:'exact',head:true}).eq('kategori',item.name);if(used.error){alert('Tidak dapat memeriksa penggunaan kategori: '+used.error.message);return}if((used.count||0)>0){alert('Kategori masih digunakan oleh '+used.count+' materi. Nonaktifkan kategori agar tidak dipakai pada materi baru, jangan hapus.');return}if(!confirm('Hapus kategori "'+item.name+'"?'))return;const{error}=await db.from('materi_categories').delete().eq('id',id);if(error){alert(error.message);return}await load()}
$('form').onsubmit=async e=>{e.preventDefault();if(!canManage()){alert('Anda tidak memiliki permission content.manage_categories.');return}const name=$('name').value.trim();if(name.length<2){message('Nama kategori minimal 2 karakter.');return}const{error}=await db.from('materi_categories').insert({name});if(error){message(error.code==='23505'?'Kategori tersebut sudah ada.':'Gagal menambahkan kategori: '+error.message);return}message('Kategori berhasil ditambahkan.');$('name').value='';await load()}
$('refresh').onclick=load;
async function boot(){session=await KryznaAuth.requirePermission('content.manage_categories',{login:'../admin/login.html',denied:null});if(!session){$('list').textContent='Akses ditolak.';return}$('manager').hidden=false;await load()}boot();
</script></body></html>
