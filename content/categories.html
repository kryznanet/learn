<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kategori Materi — Kryzna Learn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../shared/auth.js"></script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e2e8f0;--text:#172033;--muted:#64748b;--primary:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.top{background:#0f172a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top a,.btn{padding:9px 12px;border-radius:9px;text-decoration:none;border:0;font-weight:800}.top a{background:#ffffff14;color:#fff}.wrap{max-width:850px;margin:auto;padding:26px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.row{display:flex;gap:8px}.btn{cursor:pointer;background:#e2e8f0;color:#1e293b}.primary{background:var(--primary);color:#fff}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.muted{color:var(--muted);font-size:13px}.msg{margin-top:10px;padding:10px;border-radius:9px;background:#eff6ff;color:#1e40af}@media(max-width:600px){.row{flex-direction:column}}
</style></head>
<body><header class="top"><div><b>📚 Kryzna Learn</b><div style="font-size:11px;color:#94a3b8">Kelola Materi · Kategori Materi</div></div><a href="index.html">← Kelola Materi</a></header>
<main class="wrap"><section class="card"><h1 style="margin:0 0 6px">Kategori Materi</h1><p class="muted">Tambahkan kategori baru yang dapat dipilih saat membuat atau mengedit materi.</p></section>
<section class="card" id="manager" hidden><form id="form"><label for="name">Nama kategori baru</label><div class="row"><input id="name" maxlength="80" required placeholder="Contoh: Praktik Lab"><button class="btn primary" type="submit">+ Tambah Kategori</button></div></form><div id="msg"></div></section>
<section class="card"><h2 style="margin-top:0">Kategori aktif</h2><div id="list" class="muted">Memuat…</div></section></main>
<script>
const db=supabaseClient,$=id=>document.getElementById(id);let session=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function canManage(){return KryznaAuth.hasPermission('content.manage_categories',session?.permissions)}
async function load(){const{data,error}=await db.from('materi_categories').select('id,name,created_at').eq('is_active',true).order('name',{ascending:true});if(error){$('list').textContent='Gagal memuat kategori: '+error.message;return}$('list').innerHTML=data?.length?data.map(x=>'<div class="item"><b>'+esc(x.name)+'</b><span class="muted">'+new Date(x.created_at).toLocaleDateString('id-ID')+'</span></div>').join(''):'Belum ada kategori.'}
$('form').onsubmit=async e=>{e.preventDefault();if(!canManage()){alert('Anda tidak memiliki permission content.manage_categories.');return}const name=$('name').value.trim();if(name.length<2){$('msg').className='msg';$('msg').textContent='Nama kategori minimal 2 karakter.';return}const{error}=await db.from('materi_categories').insert({name});$('msg').className='msg';if(error){$('msg').textContent=error.code==='23505'?'Kategori tersebut sudah ada.':'Gagal menambahkan kategori: '+error.message;return}$('msg').textContent='Kategori berhasil ditambahkan.';$('name').value='';await load()}
async function boot(){session=await KryznaAuth.requirePermission('content.manage_categories',{login:'../admin/login.html',denied:null});if(!session){$('list').textContent='Akses ditolak.';return}$('manager').hidden=false;await load()}boot();
</script></body></html>
