<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Materi — Kelola Materi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="../shared/content-activity.js"></script>

  <style>body.kx-modern .top{display:none}.wrap{max-width:1180px}.hero{margin-bottom:8px}.filters{align-items:center}.filters input,.filters select{min-height:42px}.card{box-shadow:0 6px 20px #0f172a08}.head h3{line-height:1.35}.badge{white-space:nowrap}.actions{margin-top:14px}.actions .btn{min-height:40px}@media(max-width:650px){.wrap{padding:20px 14px}.filters{display:grid;grid-template-columns:1fr}.filters input{min-width:0;width:100%}.head{flex-direction:column}.badge{align-self:flex-start}.actions .btn{flex:1;text-align:center}}</style>
</head>

<body>
  <header class="top">
    <div>
      <b>📚 Kryzna Learn</b>
      <div style="font-size:11px;color:#94a3b8">
        Kelola Materi · Daftar Materi
      </div>
    </div>
    <div>
      <a href="index.html">← Kelola Materi</a>
    </div>
  </header>

  <main class="wrap">
    <section>
      <div style="font-size:12px;color:#2563eb;font-weight:900;letter-spacing:.08em">
        DAFTAR MATERI
      </div>
      <div class="hero">
        <h1>Daftar Materi</h1>
        <p class="muted">
          Kelola status materi: Draft → Review → Published → Archived.
        </p>
      </div>
    </section>

    <section class="filters">
      <input id="q" placeholder="🔎 Cari judul atau kategori...">
      <select id="status">
        <option value="all">Semua status</option>
        <option value="draft">Draft</option>
        <option value="review">Review</option>
        <option value="published">Published</option>
        <option value="archived">Archived</option>
      </select>
      <select id="cat">
        <option value="all">Semua kategori</option>
      </select>
    </section>

    <section id="list">
      <div class="empty">Memuat...</div>
    </section>
  </main>

  <script>
    const db = supabaseClient;
    const $ = (id) => document.getElementById(id);

    let session = null;
    let rows = [];

    const esc = (value) => String(value ?? '').replace(
      /[&<>"']/g,
      (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char])
    );

    const can = (permission) => KryznaAuth.hasPermission(
      permission,
      session?.permissions
    );

    async function boot() {
      session = await KryznaAuth.requirePermission(
        'content.read',
        {
          login: '../admin/login.html',
          denied: null
        }
      );

      if (!session) {
        $('list').innerHTML = '<div class="empty">Akses ditolak.</div>';
        return;
      }

      await load();
    }

    async function load() {
      const { data, error } = await db
        .from('materi')
        .select(
          'id,judul,deskripsi_singkat,kategori,slug,status,author_id,updated_at'
        )
        .order('updated_at', { ascending: false });

      if (error) {
        $('list').innerHTML =
          '<div class="empty">Gagal memuat: ' +
          esc(error.message) +
          '</div>';
        return;
      }

      rows = data || [];
      buildCats();
      render();
    }

    function buildCats() {
      const cats = [
        ...new Set(
          rows
            .map((item) => String(item.kategori || 'Umum').trim())
        )
      ]
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b, 'id'));

      $('cat').innerHTML =
        '<option value="all">Semua kategori</option>' +
        cats
          .map(
            (item) =>
              '<option value="' +
              esc(item) +
              '">' +
              esc(item) +
              '</option>'
          )
          .join('');
    }

    function render() {
      const query = $('q').value.toLowerCase().trim();
      const status = $('status').value;
      const category = $('cat').value;

      const filtered = rows.filter(
        (item) =>
          (status === 'all' || item.status === status) &&
          (category === 'all' || item.kategori === category) &&
          (!query ||
            [item.judul, item.deskripsi_singkat, item.kategori]
              .join(' ')
              .toLowerCase()
              .includes(query))
      );

      $('list').innerHTML =
        filtered
          .map((item) => {
            const next =
              item.status === 'draft'
                ? 'review'
                : item.status === 'review'
                  ? 'published'
                  : item.status === 'published'
                    ? 'archived'
                    : 'draft';

            const label =
              item.status === 'draft'
                ? 'Kirim Review'
                : item.status === 'review'
                  ? 'Publish'
                  : item.status === 'published'
                    ? 'Arsipkan'
                    : 'Kembalikan ke Draft';

            const permission = {
              draft: 'content.review',
              review: 'content.publish',
              published: 'content.archive',
              archived: 'content.update'
            }[item.status];

            const canAdvance = can(permission);

            return `
              <article class="card">
                <div class="head">
                  <div>
                    <h3 style="margin:0 0 5px">
                      ${esc(item.judul)}
                    </h3>
                    <div class="muted">
                      ${esc(item.kategori || 'Umum')} · diperbarui
                      ${new Date(item.updated_at).toLocaleString('id-ID')}
                    </div>
                  </div>
                  <span class="badge">${esc(item.status)}</span>
                </div>

                <div class="muted" style="margin-top:8px">
                  ${esc(item.deskripsi_singkat || 'Belum ada deskripsi.')}
                </div>

                <div class="actions">
                  ${can('content.update') ? `
                    <a
                      class="btn primary"
                      href="editor.html?id=${encodeURIComponent(item.id)}"
                    >
                      Tulis / Edit
                    </a>
                  ` : ''}

                  ${can('content.read') ? `
                    <a
                      class="btn"
                      href="versions.html?id=${encodeURIComponent(item.id)}"
                    >
                      Riwayat Versi
                    </a>
                  ` : ''}

                  ${canAdvance ? `
                    <button
                      class="btn ${esc(next)}"
                      onclick="changeStatus('${item.id}', '${next}')"
                    >
                      ${label}
                    </button>
                  ` : ''}

                  ${can('content.delete') ? `
                    <button
                      class="btn danger"
                      onclick="deleteMaterial('${item.id}')"
                    >
                      Hapus
                    </button>
                  ` : ''}
                </div>
              </article>
            `;
          })
          .join('') ||
        '<div class="empty">Tidak ada materi sesuai filter.</div>';
    }

    async function changeStatus(id, status) {
      const current = rows.find((item) => item.id === id);
      if (!current) return;

      const from = current.status;
      if (from === status) return;

      const permission = {
        draft: 'content.review',
        review: 'content.publish',
        published: 'content.archive',
        archived: 'content.update'
      }[from];

      if (!can(permission)) {
        alert('Anda tidak memiliki permission untuk aksi ini.');
        return;
      }

      if (!confirm('Ubah status materi menjadi ' + status + '?')) return;

      const result = await db
        .from('materi')
        .update({ status })
        .eq('id', id);

      if (result.error) {
        alert('Gagal mengubah status: ' + result.error.message);
        return;
      }

      const log = await window.kryznaLogContent({
        action: 'status_changed',
        entityId: id,
        description:
          'Status materi "' +
          (current.judul || '') +
          '" diubah dari ' +
          from +
          ' menjadi ' +
          status,
        metadata: {
          from,
          to: status
        }
      });

      if (log?.error) {
        console.warn(
          'Status berhasil diubah tetapi log gagal:',
          log.error
        );
      }

      await load();
    }

    async function deleteMaterial(id) {
      if (!can('content.delete')) {
        alert('Anda tidak memiliki permission untuk menghapus materi.');
        return;
      }

      const current = rows.find((item) => item.id === id);
      if (!current) return;

      const title = current.judul || 'materi ini';
      const confirmed = confirm(
        'Hapus "' +
        title +
        '" secara permanen? Riwayat versi terkait juga akan dihapus.'
      );

      if (!confirmed) return;

      const result = await db
        .from('materi')
        .delete()
        .eq('id', id);

      if (result.error) {
        alert('Gagal menghapus materi: ' + result.error.message);
        return;
      }

      const log = await window.kryznaLogContent({
        action: 'deleted',
        entityId: null,
        description: 'Menghapus materi "' + title + '" secara permanen',
        metadata: {
          material_id: id,
          status: current.status
        }
      });

      if (log?.error) {
        console.warn('Materi terhapus tetapi log gagal:', log.error);
      }

      await load();
    }

    $('q').oninput = render;
    $('status').onchange = render;
    $('cat').onchange = render;

    boot();
  </script>
</body>
</html>
