<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materi — Kelola Konten</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../shared/content-activity.js"></script><style>:root{--bg:#f6f8fc;--card:#fff;--line:#e2e8f0;--text:#172033;--muted:#64748b;--primary:#2563eb;--soft:#eff6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.top{background:#0f172a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}.top a,.btn{display:inline-block;padding:9px 12px;border-radius:9px;text-decoration:none;border:0;font-weight:800}.top a{background:#ffffff14;color:#fff}.wrap{max-width:1100px;margin:auto;padding:26px 18px}.hero h1{margin:5px 0}.muted{color:var(--muted);font-size:13px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.filters input,.filters select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.filters input{flex:1;min-width:220px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin:10px 0}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:var(--soft);color:#1d4ed8}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{cursor:pointer;background:#e2e8f0;color:#1e293b}.primary{background:var(--primary);color:#fff}.review{background:#fef3c7;color:#92400e}.published{background:#dcfce7;color:#166534}.archived{background:#e5e7eb;color:#374151}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:650px){.head{flex-direction:column}}</style></head><body><header class="top"><div><b>📚 Kryzna Learn</b><div style="font-size:11px;color:#94a3b8">Kelola Konten · Workflow</div></div><div><a href="index.html">← Workspace</a></div></header><main class="wrap"><section><div style="font-size:12px;color:#2563eb;font-weight:900;letter-spacing:.08em">CONTENT WORKFLOW</div><div class="hero"><h1>Materi</h1><p class="muted">Kelola status materi: Draft → Review → Published → Archived.</p></div></section><section class="filters"><input id="q" placeholder="🔎 Cari judul atau kategori..."><select id="status"><option value="all">Semua status</option><option value="draft">Draft</option><option value="review">Review</option><option value="published">Published</option><option value="archived">Archived</option></select><select id="cat"><option value="all">Semua kategori</option></select></section><section id="list"><div class="empty">Memuat...</div></section></main><script>const db=supabaseClient,$=id=>document.getElementById(id);let userRole='',rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function boot(){const {data:{user},error}=await db.auth.getUser();if(error||!user){location.href='../admin/login.html';return}const {data:r}=await db.from('admin_users').select('role,active').eq('user_id',user.id).maybeSingle();if(!r?.active||!['penulis','editor','admin','super_admin'].includes(r.role)){document.body.innerHTML='<div class="empty">Akses ditolak.</div>';return}userRole=r.role;await load()}async function load(){const {data,error}=await db.from('materi').select('id,judul,deskripsi_singkat,kategori,slug,status,author_id,updated_at').order('updated_at',{ascending:false});if(error){$('list').innerHTML='<div class="empty">Gagal memuat: '+esc(error.message)+'</div>';return}rows=data||[];buildCats();render()}function buildCats(){const cats=[...new Set(rows.map(x=>String(x.kategori||'Umum').trim()))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'id'));$('cat').innerHTML='<option value="all">Semua kategori</option>'+cats.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')}function render(){const q=$('q').value.toLowerCase().trim(),s=$('status').value,c=$('cat').value;const a=rows.filter(x=>(s==='all'||x.status===s)&&(c==='all'||x.kategori===c)&&(!q||[x.judul,x.deskripsi_singkat,x.kategori].join(' ').toLowerCase().includes(q)));$('list').innerHTML=a.map(x=>{const next=x.status==='draft'?'review':x.status==='review'?'published':x.status==='published'?'archived':'draft';const label=x.status==='draft'?'Kirim Review':x.status==='review'?'Publish':x.status==='published'?'Arsipkan':'Kembalikan ke Draft';const canAdvance=userRole==='super_admin'||userRole==='admin'||(userRole==='editor'&&['review','published','archived'].includes(x.status))||(userRole==='penulis'&&x.status==='draft');return '<article class="card"><div class="head"><div><h3 style="margin:0 0 5px">'+esc(x.judul)+'</h3><div class="muted">'+esc(x.kategori||'Umum')+' · diperbarui '+new Date(x.updated_at).toLocaleString('id-ID')+'</div></div><span class="badge">'+esc(x.status)+'</span></div><div class="muted" style="margin-top:8px">'+esc(x.deskripsi_singkat||'Belum ada deskripsi.')+'</div><div class="actions"><a class="btn primary" href="../admin/dashboard.html">Buka Editor</a>'+(canAdvance?'<button class="btn '+esc(next)+'" onclick="changeStatus(\''+x.id+'\',\''+next+'\',\''+esc(x.judul).replace(/'/g,"&#039;")+'\')">'+label+'</button>':'')+'</div></article>'}).join('')||'<div class="empty">Tidak ada materi sesuai filter.</div>'}async function changeStatus(id,status,title){if(!confirm('Ubah status materi menjadi '+status+'?'))return;const r=await db.from('materi').update({status}).eq('id',id);if(r.error){alert('Gagal mengubah status: '+r.error.message);return}await window.kryznaLogContent({action:'status_changed',entityId:id,description:'Status materi "'+title+'" diubah menjadi '+status,metadata:{from:null,to:status}});await load()}$('q').oninput=render;$('status').onchange=render;$('cat').onchange=render;boot();</script></body></html>
