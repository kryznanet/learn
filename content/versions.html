<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Versi — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>:root{--bg:#f6f8fc;--card:#fff;--line:#e2e8f0;--text:#172033;--muted:#64748b;--primary:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.top{background:#0f172a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top a,.btn{padding:9px 12px;border-radius:9px;text-decoration:none;border:0;font-weight:800}.top a{background:#ffffff14;color:#fff}.wrap{max-width:1000px;margin:auto;padding:24px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}.muted{color:var(--muted);font-size:13px}.item{display:flex;justify-content:space-between;gap:15px;align-items:center}.btn{cursor:pointer;background:#e2e8f0;color:#1e293b}.primary{background:var(--primary);color:#fff}.preview{margin-top:12px;padding:14px;background:#f8fafc;border-radius:10px;line-height:1.7}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:650px){.item{flex-direction:column;align-items:flex-start}}</style></head><body><header class="top"><div><b>📚 Kryzna Learn</b><div style="font-size:11px;color:#94a3b8">Riwayat Versi Materi</div></div><a id="back" href="materials.html">← Kelola Materi</a></header><main class="wrap"><section class="card"><h1 id="heading" style="margin:0 0 5px">Riwayat Versi</h1><div id="info" class="muted">Memuat...</div></section><section id="list"><div class="empty">Memuat versi...</div></section></main><script>const db=supabaseClient,$=id=>document.getElementById(id);let role='',materialId='',versions=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function clean(html){const d=new DOMParser().parseFromString(html||'','text/html');d.querySelectorAll('script,iframe,object,embed,form,link,meta').forEach(x=>x.remove());return d.body.innerHTML}async function boot(){materialId=new URLSearchParams(location.search).get('id');if(!materialId){$('info').textContent='ID materi tidak ditemukan.';return}const {data:{user},error}=await db.auth.getUser();if(error||!user){location.href='../admin/login.html';return}const {data:r}=await db.from('admin_users').select('role,active').eq('user_id',user.id).maybeSingle();if(!r?.active||!['penulis','editor','admin','super_admin'].includes(r.role)){document.body.innerHTML='<main class="wrap"><section class="card">Akses ditolak.</section></main>';return}role=r.role;$('back').href='editor.html?id='+encodeURIComponent(materialId);const {data:m}=await db.from('materi').select('judul').eq('id',materialId).maybeSingle();if(m){$('heading').textContent='Riwayat Versi: '+m.judul;$('info').textContent='Setiap penyimpanan materi membuat snapshot versi baru.'}await load()}async function load(){const {data,error}=await db.from('materi_versions').select('id,version_number,judul,deskripsi_singkat,kategori,konten,status,created_by,created_at').eq('materi_id',materialId).order('version_number',{ascending:false});if(error){$('list').innerHTML='<div class="empty">Gagal memuat: '+esc(error.message)+'</div>';return}versions=data||[];$('list').innerHTML=versions.map(v=>'<article class="card"><div class="item"><div><b>Versi #'+v.version_number+'</b><div class="muted">'+new Date(v.created_at).toLocaleString('id-ID')+' · '+esc(v.status||'')+'</div><div class="muted">'+esc(v.judul||'')+'</div></div><div>'+((role==='editor'||role==='admin'||role==='super_admin')?'<button class="btn primary" onclick="restore(\''+v.id+'\', '+v.version_number+')">Pulihkan</button>':'')+'</div></div><details><summary>Lihat isi versi</summary><div class="preview">'+clean(v.konten||'<span class="muted">Kosong</span>')+'</div></details></article>').join('')||'<div class="empty">Belum ada riwayat versi.</div>'}async function restore(id,n){if(!confirm('Pulihkan Versi #'+n+'? Perubahan saat ini akan menjadi snapshot versi baru.'))return;const {data,error}=await db.rpc('restore_materi_version',{p_version_id:id});if(error){alert('Gagal restore: '+error.message);return}alert('Versi #'+n+' berhasil dipulihkan.');location.href='editor.html?id='+encodeURIComponent(materialId)}boot();</script></body></html>
