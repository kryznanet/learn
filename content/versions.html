<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riwayat Versi — Kryzna Learn</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../shared/auth.js"></script>
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #fff;
      --line: #e2e8f0;
      --text: #172033;
      --muted: #64748b;
      --primary: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Arial, sans-serif;
    }

    .top {
      background: #0f172a;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .top a,
    .btn {
      padding: 9px 12px;
      border-radius: 9px;
      text-decoration: none;
      border: 0;
      font-weight: 800;
    }

    .top a {
      background: #ffffff14;
      color: #fff;
    }

    .wrap {
      max-width: 1000px;
      margin: auto;
      padding: 24px 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
    }

    .btn {
      cursor: pointer;
      background: #e2e8f0;
      color: #1e293b;
    }

    .primary {
      background: var(--primary);
      color: #fff;
    }

    .preview {
      margin-top: 12px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 10px;
      line-height: 1.7;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: var(--muted);
    }

    @media (max-width: 650px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <b>📚 Kryzna Learn</b>
      <div style="font-size: 11px; color: #94a3b8">
        Riwayat Versi Materi
      </div>
    </div>
    <a id="back" href="materials.html">← Kelola Materi</a>
  </header>

  <main class="wrap">
    <section class="card">
      <h1 id="heading" style="margin: 0 0 5px">Riwayat Versi</h1>
      <div id="info" class="muted">Memuat...</div>
    </section>

    <section id="list">
      <div class="empty">Memuat versi...</div>
    </section>
  </main>

  <script>
    const db = supabaseClient;
    const $ = (id) => document.getElementById(id);

    let session = null;
    let materialId = '';
    let versions = [];

    function esc(value) {
      return String(value ?? '').replace(
        /[&<>"']/g,
        (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[char])
      );
    }

    function clean(html) {
      const doc = new DOMParser().parseFromString(html || '', 'text/html');
      doc
        .querySelectorAll('script,iframe,object,embed,form,link,meta')
        .forEach((element) => element.remove());
      return doc.body.innerHTML;
    }

    async function boot() {
      materialId = new URLSearchParams(location.search).get('id');

      if (!materialId) {
        $('info').textContent = 'ID materi tidak ditemukan.';
        return;
      }

      session = await KryznaAuth.requirePermission('content.read', {
        login: '../admin/login.html',
        denied: null
      });

      if (!session) {
        document.body.innerHTML = `
          <main class="wrap">
            <section class="card">Akses ditolak.</section>
          </main>
        `;
        return;
      }

      $('back').href = 'editor.html?id=' + encodeURIComponent(materialId);

      const { data: material } = await db
        .from('materi')
        .select('judul')
        .eq('id', materialId)
        .maybeSingle();

      if (material) {
        $('heading').textContent = 'Riwayat Versi: ' + material.judul;
        $('info').textContent =
          'Setiap penyimpanan materi membuat snapshot versi baru.';
      }

      await load();
    }

    async function load() {
      const { data, error } = await db
        .from('materi_versions')
        .select(
          'id,version_number,judul,deskripsi_singkat,kategori,konten,status,created_by,created_at'
        )
        .eq('materi_id', materialId)
        .order('version_number', { ascending: false });

      if (error) {
        $('list').innerHTML =
          '<div class="empty">Gagal memuat: ' + esc(error.message) + '</div>';
        return;
      }

      versions = data || [];
      const canRestore = KryznaAuth.hasPermission(
        'content.review',
        session.permissions
      );

      $('list').innerHTML = versions.map((version) => `
        <article class="card">
          <div class="item">
            <div>
              <b>Versi #${version.version_number}</b>
              <div class="muted">
                ${new Date(version.created_at).toLocaleString('id-ID')}
                · ${esc(version.status || '')}
              </div>
              <div class="muted">${esc(version.judul || '')}</div>
            </div>
            <div>
              ${canRestore
                ? `<button class="btn primary" onclick="restore('${version.id}', ${version.version_number})">Pulihkan</button>`
                : ''}
            </div>
          </div>
          <details>
            <summary>Lihat isi versi</summary>
            <div class="preview">
              ${clean(version.konten || '<span class="muted">Kosong</span>')}
            </div>
          </details>
        </article>
      `).join('') || '<div class="empty">Belum ada riwayat versi.</div>';
    }

    async function restore(id, versionNumber) {
      if (!KryznaAuth.hasPermission('content.review', session.permissions)) {
        alert('Anda tidak memiliki permission untuk memulihkan versi.');
        return;
      }

      if (!confirm(
        'Pulihkan Versi #' +
        versionNumber +
        '? Perubahan saat ini akan menjadi snapshot versi baru.'
      )) {
        return;
      }

      const { error } = await db.rpc('restore_materi_version', {
        p_version_id: id
      });

      if (error) {
        alert('Gagal restore: ' + error.message);
        return;
      }

      alert('Versi #' + versionNumber + ' berhasil dipulihkan.');
      location.href = 'editor.html?id=' + encodeURIComponent(materialId);
    }

    boot();
  </script>
</body>
</html>
