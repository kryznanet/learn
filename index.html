<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kryzna Learn - Edukasi Jaringan & Komputer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>:root{--bg:#f4f7f6;--card:#fff;--text:#333;--muted:#555;--head:#1e3a8a;--border:#0ea5e9} [data-theme=dark]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#cbd5e1;--head:#1e1b4b;--border:#38bdf8}*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{margin:0;background:var(--bg);color:var(--text);line-height:1.6}header{background:var(--head);color:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}header a,nav a{color:#fff;text-decoration:none}nav{display:flex;gap:1.2rem;align-items:center}.theme{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}.hero{background:linear-gradient(135deg,#1e3a8a,#0ea5e9);color:#fff;text-align:center;padding:4rem 1rem}.hero h2{font-size:2.4rem;margin:.2rem 0}.search{max-width:500px;margin:-25px auto 35px;padding:0 15px}.search input{width:100%;padding:18px 24px;border:0;border-radius:50px;box-shadow:0 8px 25px #0002;font-size:16px;background:var(--card);color:var(--text)}.layout{max-width:1100px;margin:auto;padding:0 15px 40px;display:flex;gap:30px}.side{width:260px;background:var(--card);padding:20px;border-radius:12px;box-shadow:0 4px 15px #0001;height:max-content}.side h3{border-bottom:2px solid var(--border);padding-bottom:7px}.side ul{list-style:none;padding:0}.side li{margin:8px 0}.side a{color:var(--muted);text-decoration:none}.content{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}.card{background:var(--card);padding:22px;border-radius:12px;border-top:4px solid var(--border);box-shadow:0 4px 15px #0001;display:flex;flex-direction:column;justify-content:space-between}.badge{font-size:12px;color:#0ea5e9;font-weight:700;text-transform:uppercase}.card h3{margin:7px 0}.card p{color:var(--muted);font-size:14px}.read{color:#0ea5e9;font-weight:700;text-decoration:none}.status{text-align:center;padding:30px;color:var(--muted)}@media(max-width:768px){.layout{flex-direction:column}.side{width:auto}}
</style></head><body><header><a href="index.html"><h1>Kryzna Learn</h1></a><nav><a href="#materi">Materi</a><a href="#tutorial">Tutorial</a><a href="admin/login.html">Admin</a><button class="theme" id="theme" onclick="toggleTheme()">🌙</button></nav></header><section class="hero"><h2>Belajar Jaringan Komputer Jadi Mudah</h2><p>Pusat materi dan panduan praktis seputar jaringan komputer.</p></section><div class="search"><input id="search" placeholder="🔍 Cari materi atau tutorial..." oninput="filterMateri()"></div><main class="layout" id="materi"><aside class="side"><h3>Daftar Materi</h3><ul id="sm"></ul><h3>Daftar Tutorial</h3><ul id="st"></ul></aside><section class="content" id="tutorial"><h2>Daftar Tutorial & Materi</h2><div class="grid" id="grid"><div class="status">Memuat materi...</div></div></section></main><script>let all=[];const db=supabaseClient;document.addEventListener('DOMContentLoaded',()=>{let t=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=t;theme.textContent=t==='dark'?'☀️':'🌙';load()});async function load(){const r=await db.from('materi').select('id,judul,deskripsi_singkat,link_halaman,kategori').order('created_at',{ascending:false});if(r.error||!r.data?.length){fetch('data.json?v='+Date.now()).then(x=>x.json()).then(d=>{all=d;render(d)}).catch(()=>grid.innerHTML='<div class="status">Gagal memuat materi.</div>')}else{all=r.data.map(x=>({judul:x.judul,deskripsiSingkat:x.deskripsi_singkat,linkHalaman:x.link_halaman,kategori:x.kategori}));render(all)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(a){if(!a.length){grid.innerHTML='<div class="status">Materi tidak ditemukan.</div>';return}grid.innerHTML=a.map(x=>`<article class="card"><div><span class="badge">${esc(x.kategori||'Umum')}</span><h3>${esc(x.judul)}</h3><p>${esc(x.deskripsiSingkat)}</p></div><a class="read" href="${esc(x.linkHalaman||'#')}">Baca Selengkapnya →</a></article>`).join('');let m=a.filter(x=>(x.kategori||'').toLowerCase()==='materi'),t=a.filter(x=>(x.kategori||'').toLowerCase()==='tutorial');sm.innerHTML=m.map(x=>`<li><a href="${esc(x.linkHalaman)}">• ${esc(x.judul)}</a></li>`).join('')||'<li>Tidak ada materi</li>';st.innerHTML=t.map(x=>`<li><a href="${esc(x.linkHalaman)}">• ${esc(x.judul)}</a></li>`).join('')||'<li>Tidak ada tutorial</li>'}function filterMateri(){let q=search.value.toLowerCase().trim();render(q?all.filter(x=>(x.judul+' '+x.deskripsiSingkat+' '+x.kategori).toLowerCase().includes(q)):all)}function toggleTheme(){let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);theme.textContent=t==='dark'?'☀️':'🌙'}</script></body></html>
