<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryzna Learn - Edukasi Jaringan & Komputer</title>
    <meta name="description" content="Kryzna Learn - Platform edukasi gratis dan panduan praktis belajar dasar-dasar jaringan komputer.">
    
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-muted: #555555;
            --header-bg: #1e3a8a;
            --border-card: #0ea5e9;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #cbd5e1;
            --header-bg: #1e1b4b;
            --border-card: #38bdf8;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }

        header { background-color: var(--header-bg); color: #fff; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        nav a { color: #fff; cursor: pointer; font-weight: 500; text-decoration: none; }

        /* Layout Sidebar */
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .main-layout { display: flex; gap: 2rem; align-items: flex-start; }
        .sidebar { width: 280px; background: var(--bg-card); padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px var(--shadow); position: sticky; top: 100px; }
        .sidebar h3 { margin-bottom: 1rem; color: var(--text-main); border-bottom: 2px solid var(--border-card); padding-bottom: 0.5rem; }
        .sidebar ul { list-style: none; }
        .sidebar li { margin-bottom: 0.8rem; }
        .sidebar a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; }
        .sidebar a:hover { color: #0ea5e9; font-weight: bold; }
        
        .content { flex: 1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: var(--bg-card); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 15px var(--shadow); border-top: 4px solid var(--border-card); }
        
        .hero { background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 100%); color: white; text-align: center; padding: 4rem 1rem; }
        .theme-toggle { cursor: pointer; background: none; border: none; font-size: 1.2rem; color: white; }

        @media (max-width: 768px) { .main-layout { flex-direction: column; } .sidebar { width: 100%; position: relative; top: 0; } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" style="color:white; text-decoration:none;"><h1>Kryzna Learn</h1></a>
        <div class="nav-right">
            <nav>
                <a onclick="scrollToSection('tutorial')">Tutorial</a>
            </nav>
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <section class="hero">
        <h2>Belajar Jaringan Komputer Jadi Mudah</h2>
    </section>

    <main class="main-layout container" id="tutorial">
        <aside class="sidebar">
            <h3>Daftar Materi</h3>
            <ul id="sidebar-list"></ul>
        </aside>

        <section class="content">
            <h2 style="margin-bottom: 1.5rem;">Daftar Tutorial</h2>
            <div class="grid" id="tutorial-grid"></div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('theme-btn').textContent = theme === 'dark' ? '☀️' : '🌙';
            loadMateri();
        });

        function loadMateri() {
            fetch('materi.json?v=' + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    // Update Grid
                    const grid = document.getElementById('tutorial-grid');
                    grid.innerHTML = data.map(item => `
                        <div class="card">
                            <h3>${item.judul}</h3>
                            <p>${item.deskripsiSingkat}</p>
                            <br><a href="${item.linkHalaman}" style="color:#0ea5e9; font-weight:bold; text-decoration:none;">Baca Selengkapnya →</a>
                        </div>
                    `).join('');

                    // Update Sidebar
                    const sidebar = document.getElementById('sidebar-list');
                    sidebar.innerHTML = data.map(item => `
                        <li><a href="${item.linkHalaman}">• ${item.judul}</a></li>
                    `).join('');
                });
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
        }

        function scrollToSection(id) { document.getElementById(id).scrollIntoView({ behavior: 'smooth' }); }
    </script>
</body>
</html>
