<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryzna Learn - Edukasi Jaringan & Komputer</title>
    <meta name="description" content="Kryzna Learn - Platform edukasi gratis dan panduan praktis belajar dasar-dasar jaringan komputer.">
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-muted: #555555;
            --header-bg: #1e3a8a;
            --border-card: #0ea5e9;
            --shadow: rgba(0, 0, 0, 0.05);
        }
        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #cbd5e1;
            --header-bg: #1e1b4b;
            --border-card: #38bdf8;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        header { background-color: var(--header-bg); color: #fff; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        nav { display: flex; gap: 1.5rem; }
        nav a { color: #fff; cursor: pointer; font-weight: 500; text-decoration: none; }
        nav a:hover { color: #38bdf8; }
        .hero { background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 100%); color: white; text-align: center; padding: 4rem 1rem; }
        .hero h2 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .search-container { max-width: 500px; margin: -1.8rem auto 3rem auto; padding: 0 1rem; position: relative; z-index: 10; }
        .search-input { width: 100%; padding: 1.2rem 1.8rem; font-size: 1rem; border: 1px solid transparent; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); outline: none; background-color: var(--bg-card); color: var(--text-main); }
        .search-input:focus { border-color: #0ea5e9; box-shadow: 0 10px 25px rgba(14, 165, 233, 0.25); }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .main-layout { display: flex; gap: 2rem; align-items: flex-start; }
        .sidebar { width: 280px; background: var(--bg-card); padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px var(--shadow); position: sticky; top: 100px; display: flex; flex-direction: column; gap: 1.5rem; }
        .sidebar-group h3 { margin-bottom: 0.8rem; color: var(--text-main); border-bottom: 2px solid var(--border-card); padding-bottom: 0.4rem; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .sidebar-group ul { list-style: none; }
        .sidebar-group li { margin-bottom: 0.6rem; }
        .sidebar-group a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; display: block; }
        .sidebar-group a:hover { color: #0ea5e9; font-weight: bold; }
        .content { flex: 1; }
        .section-title { margin-bottom: 1.5rem; color: var(--header-bg); font-size: 1.8rem; }
        [data-theme="dark"] .section-title { color: #38bdf8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: var(--bg-card); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 15px var(--shadow); border-top: 4px solid var(--border-card); display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { margin-bottom: 0.5rem; font-size: 1.2rem; color: var(--text-main); }
        .card p { margin-bottom: 1.2rem; color: var(--text-muted); font-size: 0.9rem; }
        .btn-read { color: #0ea5e9; font-weight: bold; text-decoration: none; font-size: 0.9rem; }
        .btn-read:hover { text-decoration: underline; }
        .theme-toggle { cursor: pointer; background: none; border: none; font-size: 1.2rem; color: white; padding: 0.5rem; border-radius: 50%; }
        .theme-toggle:hover { background-color: rgba(255,255,255,0.2); }
        .no-results, .error-message { text-align: center; grid-column: 1/-1; padding: 3rem; color: var(--text-muted); }
        .error-message { border: 1px solid #f59e0b; border-radius: 12px; background: rgba(245, 158, 11, 0.08); }
        .error-message strong { display: block; margin-bottom: 0.5rem; color: #b45309; }
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; position: relative; top: 0; }
        }
    </style>
</head>
<body id="materi">
    <header>
        <a href="index.html" style="color:white; text-decoration:none;"><h1>Kryzna Learn</h1></a>
        <div class="nav-right">
            <nav>
                <a onclick="scrollToSection('materi')">Materi</a>
                <a onclick="scrollToSection('tutorial')">Tutorial</a>
            </nav>
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" aria-label="Ganti tema">🌙</button>
        </div>
    </header>

    <section class="hero">
        <h2>Belajar Jaringan Komputer Jadi Mudah</h2>
        <p>Pusat materi dan panduan praktis seputar jaringan komputer.</p>
    </section>

    <div class="search-container">
        <input type="text" id="search-bar" class="search-input" placeholder="🔍 Cari materi atau tutorial (misal: ping, kabel, ip)..." onkeyup="filterMateri()">
    </div>

    <main class="main-layout container" id="tutorial">
        <aside class="sidebar">
            <div class="sidebar-group">
                <h3>Daftar Materi</h3>
                <ul id="sidebar-materi"><li style="color:var(--text-muted); font-size:0.85rem;">Memuat...</li></ul>
            </div>
            <div class="sidebar-group">
                <h3>Daftar Tutorial</h3>
                <ul id="sidebar-tutorial"><li style="color:var(--text-muted); font-size:0.85rem;">Memuat...</li></ul>
            </div>
        </aside>

        <section class="content">
            <h2 class="section-title">Daftar Tutorial & Materi</h2>
            <div class="grid" id="tutorial-grid">
                <div class="no-results">Memuat materi...</div>
            </div>
        </section>
    </main>

    <script>
        'use strict';

        let dataMateriGlobal = [];

        document.addEventListener('DOMContentLoaded', () => {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeButton(theme);
            loadMateri();
        });

        async function loadMateri() {
            const url = 'data.json?v=' + Date.now();
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} saat memuat data.json`);
                }

                const contentType = response.headers.get('content-type') || '';
                const rawText = await response.text();
                let data;

                try {
                    data = JSON.parse(rawText);
                } catch (parseError) {
                    throw new Error('Isi data.json bukan JSON yang valid. Pastikan file hanya berisi JSON tanpa HTML atau teks tambahan.');
                }

                if (!Array.isArray(data)) {
                    throw new Error('Struktur data.json harus berupa array JSON, contohnya: [ { ... } ].');
                }

                const invalidIndex = data.findIndex(item =>
                    !item || typeof item !== 'object' ||
                    typeof item.judul !== 'string' ||
                    typeof item.deskripsiSingkat !== 'string' ||
                    typeof item.linkHalaman !== 'string' ||
                    typeof item.kategori !== 'string'
                );

                if (invalidIndex !== -1) {
                    throw new Error(`Struktur item ke-${invalidIndex + 1} di data.json tidak lengkap. Wajib memiliki judul, deskripsiSingkat, linkHalaman, dan kategori.`);
                }

                if (contentType && !contentType.toLowerCase().includes('json') && !contentType.toLowerCase().includes('text')) {
                    console.warn('Content-Type data.json tidak biasa:', contentType);
                }

                dataMateriGlobal = data;
                tampilkanKonten(dataMateriGlobal);
            } catch (error) {
                console.error('Gagal memuat data materi:', error);
                tampilkanError(error.message);
            }
        }

        function tampilkanError(message) {
            const grid = document.getElementById('tutorial-grid');
            const sidebarMateri = document.getElementById('sidebar-materi');
            const sidebarTutorial = document.getElementById('sidebar-tutorial');

            grid.innerHTML = `
                <div class="error-message">
                    <strong>Terjadi kesalahan saat memuat data</strong>
                    <span>${escapeHtml(message)}</span>
                    <br><small>Periksa Console browser (F12) untuk detail teknis.</small>
                </div>`;
            sidebarMateri.innerHTML = '<li style="color:var(--text-muted); font-size:0.85rem;">Data gagal dimuat</li>';
            sidebarTutorial.innerHTML = '<li style="color:var(--text-muted); font-size:0.85rem;">Data gagal dimuat</li>';
        }

        function tampilkanKonten(materiArray) {
            const grid = document.getElementById('tutorial-grid');
            const sidebarMateri = document.getElementById('sidebar-materi');
            const sidebarTutorial = document.getElementById('sidebar-tutorial');

            if (!Array.isArray(materiArray) || materiArray.length === 0) {
                grid.innerHTML = '<div class="no-results">Materi atau tutorial yang Anda cari tidak ditemukan.</div>';
                sidebarMateri.innerHTML = '<li style="color:var(--text-muted); font-size:0.85rem;">Tidak ada hasil</li>';
                sidebarTutorial.innerHTML = '<li style="color:var(--text-muted); font-size:0.85rem;">Tidak ada hasil</li>';
                return;
            }

            grid.innerHTML = materiArray.map(item => `
                <div class="card">
                    <div>
                        <span style="font-size: 0.75rem; background: rgba(14,165,233,0.15); color: #0ea5e9; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: bold; text-transform: uppercase;">${escapeHtml(item.kategori || 'Umum')}</span>
                        <h3 style="margin-top: 0.5rem;">${escapeHtml(item.judul)}</h3>
                        <p>${escapeHtml(item.deskripsiSingkat)}</p>
                    </div>
                    <a href="${escapeHtml(item.linkHalaman)}" class="btn-read">Baca Selengkapnya →</a>
                </div>
            `).join('');

            const listMateri = materiArray.filter(item => item.kategori.trim().toLowerCase() === 'materi');
            const listTutorial = materiArray.filter(item => item.kategori.trim().toLowerCase() === 'tutorial');

            sidebarMateri.innerHTML = listMateri.length > 0
                ? listMateri.map(item => `<li><a href="${escapeHtml(item.linkHalaman)}">• ${escapeHtml(item.judul)}</a></li>`).join('')
                : '<li style="color:var(--text-muted); font-size:0.85rem;">Tidak ada materi</li>';

            sidebarTutorial.innerHTML = listTutorial.length > 0
                ? listTutorial.map(item => `<li><a href="${escapeHtml(item.linkHalaman)}">• ${escapeHtml(item.judul)}</a></li>`).join('')
                : '<li style="color:var(--text-muted); font-size:0.85rem;">Tidak ada tutorial</li>';
        }

        function filterMateri() {
            const searchInput = document.getElementById('search-bar');
            const searchTerm = searchInput.value.trim().toLowerCase();

            if (!searchTerm) {
                tampilkanKonten(dataMateriGlobal);
                return;
            }

            const filtered = dataMateriGlobal.filter(item =>
                item.judul.toLowerCase().includes(searchTerm) ||
                item.deskripsiSingkat.toLowerCase().includes(searchTerm) ||
                item.kategori.toLowerCase().includes(searchTerm)
            );

            tampilkanKonten(filtered);
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[char]));
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const btn = document.getElementById('theme-btn');
            if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function scrollToSection(id) {
            const element = document.getElementById(id);
            if (element) element.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
