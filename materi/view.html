<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materi — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="../supabase-config.js"></script><style>:root{--bg:#f4f7f6;--card:#fff;--text:#172033;--muted:#64748b;--blue:#2563eb;--border:#0ea5e9}[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#cbd5e1;--blue:#38bdf8;--border:#38bdf8}*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{margin:0;background:var(--bg);color:var(--text);line-height:1.7}header{background:#1e3a8a;color:#fff;padding:15px 6%;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:30px auto;padding:0 18px}.article{background:var(--card);border-radius:16px;padding:35px;box-shadow:0 6px 22px #0001}.back{color:var(--blue);font-weight:700;text-decoration:none}.meta{color:var(--muted);font-size:13px}.content h1,.content h2,.content h3,.content h4{line-height:1.3}.content a{color:var(--blue)}.content pre{background:#0f172a;color:#f8fafc;padding:16px;border-radius:10px;overflow:auto}.content code{font-family:Consolas,monospace}.content table{border-collapse:collapse;width:100%;overflow:auto}.content th,.content td{border:1px solid #cbd5e1;padding:8px;text-align:left}.content img{max-width:100%;height:auto}.content iframe{width:100%;min-height:85vh;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.filebox{margin:18px 0;padding:16px;border:1px solid #cbd5e1;border-radius:12px;background:var(--bg)}.filebox a{display:inline-block;background:var(--blue);color:#fff;padding:9px 13px;border-radius:8px;text-decoration:none;font-weight:700}.empty{text-align:center;color:var(--muted);padding:60px}@media(max-width:600px){.article{padding:22px}.content iframe{min-height:70vh}}</style></head><body><header><a href="../index.html"><strong>Kryzna Learn</strong></a><a href="../index.html">← Kembali</a></header><main class="wrap"><article class="article"><a class="back" href="../index.html">← Daftar Materi</a><div id="app" class="empty">Memuat materi...</div></article></main><script>const db=supabaseClient;marked.setOptions({gfm:true,breaks:true});document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';function safeStyleText(s){return String(s||'').replace(/@import[^;]+;?/gi,'').replace(/javascript\s*:/gi,'').replace(/expression\s*\([^)]*\)/gi,'').replace(/behavior\s*:/gi,'').replace(/-moz-binding\s*:/gi,'')}function sanitize(html){const d=new DOMParser().parseFromString(html||'','text/html');d.querySelectorAll('script,iframe,object,embed,form,link,meta').forEach(e=>e.remove());d.querySelectorAll('*').forEach(e=>{[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||a.name==='srcdoc'||((a.name==='href'||a.name==='src')&&/^\s*(javascript:|data:text\/html)/i.test(a.value)))e.removeAttribute(a.name)});if(e.tagName==='IMG'){e.setAttribute('loading','lazy');e.removeAttribute('srcset')}});d.querySelectorAll('style').forEach(s=>s.textContent=safeStyleText(s.textContent));return d.body.innerHTML}function looksLikeHtml(v){return /<\/?(p|div|h[1-6]|ul|ol|li|strong|em|u|s|a|img|blockquote|pre|code|table|span|br|font|style)\b/i.test(v||'')}function renderContent(v){return sanitize(looksLikeHtml(v)?v:marked.parse(v||'_Belum ada isi materi._'))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fileBlock(x){if(!x.file_url)return '';const name=esc(x.file_name||'File materi');const url=esc(x.file_url);if(String(x.file_type||'').includes('pdf')||/\.pdf($|\?)/i.test(x.file_name||'')){return '<div class="filebox"><strong>PDF asli</strong><p class="meta">File ditampilkan langsung dari versi asli agar format tidak berubah.</p><iframe src="'+url+'#toolbar=1&navpanes=0"></iframe><p><a target="_blank" rel="noopener" href="'+url+'">Buka / Download PDF</a></p></div>'}return '<div class="filebox"><strong>File Word asli</strong><p class="meta">Versi DOCX asli tetap tersedia tanpa konversi.</p><a target="_blank" rel="noopener" href="'+url+'">Buka / Download Word</a></div>'}async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){app.innerHTML='<div class="empty">Materi tidak ditemukan.</div>';return}const {data,error}=await db.from('materi').select('judul,deskripsi_singkat,kategori,konten,slug,file_url,file_name,file_type').eq('slug',slug).maybeSingle();if(error||!data){app.innerHTML='<div class="empty">Materi tidak ditemukan.</div>';return}document.title=data.judul+' — Kryzna Learn';app.className='';app.innerHTML='<div class="meta">'+esc(data.kategori||'Umum')+'</div><h1>'+esc(data.judul)+'</h1><p class="meta">'+esc(data.deskripsi_singkat||'')+'</p>'+fileBlock(data)+'<hr><div class="content">'+renderContent(data.konten)+'</div>'}load();</script></body></html>
