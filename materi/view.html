<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materi — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="../supabase-config.js"></script><style>:root{--bg:#f4f7f6;--card:#fff;--text:#172033;--muted:#64748b;--blue:#2563eb;--border:#0ea5e9}[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#cbd5e1;--blue:#38bdf8;--border:#38bdf8}*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{margin:0;background:var(--bg);color:var(--text);line-height:1.7}header{background:#1e3a8a;color:#fff;padding:15px 6%;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none}.wrap{max-width:900px;margin:30px auto;padding:0 18px}.article{background:var(--card);border-radius:16px;padding:35px;box-shadow:0 6px 22px #0001}.back{color:var(--blue);font-weight:700;text-decoration:none}.meta{color:var(--muted);font-size:13px}.content h1,.content h2,.content h3,.content h4{line-height:1.3}.content a{color:var(--blue)}.content pre{background:#0f172a;color:#f8fafc;padding:16px;border-radius:10px;overflow:auto}.content code{font-family:Consolas,monospace}.content :not(pre)>code{background:#e2e8f0;padding:2px 5px;border-radius:5px}.content blockquote{border-left:4px solid var(--border);padding:8px 16px;margin-left:0;background:#f8fafc}.content table{border-collapse:collapse;width:100%;display:block;overflow:auto}.content th,.content td{border:1px solid #cbd5e1;padding:8px;text-align:left}.content img{max-width:100%;height:auto;border-radius:8px}.empty{text-align:center;color:var(--muted);padding:60px}@media(max-width:600px){.article{padding:22px}}</style></head><body><header><a href="../index.html"><strong>Kryzna Learn</strong></a><a href="../index.html">← Kembali</a></header><main class="wrap"><article class="article"><a class="back" href="../index.html">← Daftar Materi</a><div id="app" class="empty">Memuat materi...</div></article></main><script>const db=supabaseClient;marked.setOptions({gfm:true,breaks:true});document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';function sanitize(html){const doc=new DOMParser().parseFromString(html||'','text/html');doc.querySelectorAll('script,iframe,object,embed,form,style,link,meta').forEach(e=>e.remove());doc.querySelectorAll('*').forEach(e=>{[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||((a.name==='href'||a.name==='src')&&/^\s*javascript:/i.test(a.value)))e.removeAttribute(a.name)});if(e.tagName==='IMG'){e.setAttribute('loading','lazy');e.removeAttribute('srcset')}});return doc.body.innerHTML}async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){app.innerHTML='<div class="empty">Materi tidak ditemukan.</div>';return}const {data,error}=await db.from('materi').select('judul,deskripsi_singkat,kategori,konten').eq('slug',slug).maybeSingle();if(error||!data){app.innerHTML='<div class="empty">Materi tidak ditemukan.</div>';return}document.title=data.judul+' — Kryzna Learn';app.className='';app.innerHTML='<div class="meta">'+esc(data.kategori||'Umum')+'</div><h1>'+esc(data.judul)+'</h1><p class="meta">'+esc(data.deskripsi_singkat||'')+'</p><hr><div class="content">'+sanitize(marked.parse(data.konten||'_Belum ada isi materi._'))+'</div>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load();</script></body></html>
