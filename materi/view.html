<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materi — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>body{margin:0;background:#f4f7f6;color:#263238;font-family:Segoe UI,sans-serif;line-height:1.7}header{background:#1e3a8a;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}header a{color:white;text-decoration:none}.wrap{max-width:900px;margin:30px auto;padding:0 18px}.card{background:white;border-radius:14px;padding:30px;box-shadow:0 5px 20px #0001}h1{color:#1e3a8a;border-bottom:2px solid #0ea5e9;padding-bottom:10px}h2{color:#1e3a8a}h3{color:#0ea5e9;margin-top:28px}pre{background:#0f172a;color:#e2e8f0;padding:16px;border-radius:9px;overflow:auto}code{background:#e0f2fe;color:#0369a1;padding:2px 5px;border-radius:4px}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{border:1px solid #ddd;padding:10px;text-align:left}th{background:#1e3a8a;color:white}.back{display:inline-block;margin-bottom:20px;color:#0284c7;font-weight:600}.meta{color:#64748b;font-size:14px}.error{text-align:center;padding:40px}.dark{background:#0f172a;color:#e2e8f0}.dark .card{background:#1e293b}.dark h1,.dark h2{color:#7dd3fc}.dark h3{color:#38bdf8}</style></head><body><header><a href="../index.html"><strong>Kryzna Learn</strong></a><button id="theme">🌙</button></header><main class="wrap"><div class="card" id="content">Memuat materi...</div></main><script>const db=supabaseClient;const box=document.getElementById('content');const slug=new URLSearchParams(location.search).get('slug');async function load(){if(!slug){box.innerHTML='<div class="error"><h2>Materi tidak ditemukan</h2></div>';return}const {data,error}=await db.from('materi').select('judul,kategori,deskripsi_singkat,konten').eq('slug',slug).maybeSingle();if(error||!data){box.innerHTML='<div class="error"><h2>Materi tidak ditemukan</h2><p>Data materi belum tersedia di Supabase.</p></div>';return}document.title=data.judul+' — Kryzna Learn';box.innerHTML='<a class="back" href="../index.html">← Kembali ke Menu Utama</a><div class="meta">'+esc(data.kategori)+'</div><h1>'+esc(data.judul)+'</h1><p><em>'+esc(data.deskripsi_singkat)+'</em></p><hr>'+sanitize(data.konten||'<p>Belum ada isi materi.</p>')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function sanitize(html){const t=document.createElement('template');t.innerHTML=html;const allowed=['H2','H3','H4','P','UL','OL','LI','STRONG','EM','B','I','CODE','PRE','BLOCKQUOTE','TABLE','THEAD','TBODY','TR','TH','TD','BR','HR'];t.content.querySelectorAll('*').forEach(el=>{if(!allowed.includes(el.tagName)){el.replaceWith(...el.childNodes);return}Array.from(el.attributes).forEach(a=>{if(a.name!=='class')el.removeAttribute(a.name)})});return t.innerHTML}document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');load();</script></body></html>
