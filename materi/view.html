<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materi — Kryzna Learn</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="../shared/auth.js"></script>
  <style>:root{--bg:#f5f7fb;--surface:#fff;--text:#102033;--muted:#64748b;--line:#e2e8f0;--primary:#2563eb}[data-theme="dark"]{--bg:#07101d;--surface:#0f1a2c;--text:#f8fafc;--muted:#cbd5e1;--line:#30425d;--primary:#60a5fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;line-height:1.75}.wrap{max-width:1020px;margin:auto;padding:26px 18px 70px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.back{color:var(--primary);font-weight:800;text-decoration:none}.theme{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:7px 10px;cursor:pointer}.article{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px #0f172a0a}.head{padding:32px 40px;border-bottom:1px solid var(--line)}.head h1{font-size:clamp(32px,5vw,54px);line-height:1.1;margin:12px 0}.kicker{color:var(--primary);font-size:11px;font-weight:900;text-transform:uppercase}.desc{color:var(--muted);margin-bottom:0}.body{padding:32px 40px}.content{font-size:17px}.content img{max-width:100%;height:auto}.content pre{background:#0b1220;color:#fff;padding:16px;border-radius:12px;overflow:auto}.content code{font-family:Consolas,monospace}.content table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}.content th,.content td{border:1px solid var(--line);padding:9px;text-align:left}.docbox{margin:0 0 20px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.doc-actions{display:flex;gap:8px;flex-wrap:wrap}.doc-btn{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}.doc-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.empty,.error{padding:30px;text-align:center;color:var(--muted)}.pdf{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;margin-top:14px}@media(max-width:600px){.wrap{padding:18px 12px 50px}.head,.body{padding:22px 18px}.content{font-size:16px}.pdf{height:60vh}.doc-actions{display:grid;grid-template-columns:1fr}.doc-btn{text-align:center}}</style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="../index.html">← Kembali ke materi</a>
      <button class="theme" id="theme" type="button">🌙</button>
    </div>

    <article class="article">
      <div id="head" class="head" hidden></div>
      <div id="app" class="empty">Memuat materi...</div>
      <div id="reading" style="padding:0 40px 28px" hidden></div><div id="engagement" style="padding:0 40px 28px" hidden></div>
    </article>
  </main>

  <script>
    const app = document.getElementById('app');
    const head = document.getElementById('head');
    const theme = document.getElementById('theme');

    function getDb() {
      return window.supabaseClient || null;
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    function safeHtml(value) {
      const document = new DOMParser().parseFromString(
        value || '',
        'text/html'
      );

      document
        .querySelectorAll('script,iframe,object,embed,form,link,meta')
        .forEach((element) => element.remove());

      document.querySelectorAll('*').forEach((element) => {
        [...element.attributes].forEach((attribute) => {
          const name = attribute.name.toLowerCase();
          const value = attribute.value || '';

          if (
            /^on/i.test(name) ||
            name === 'srcdoc' ||
            name === 'style' ||
            ((name === 'href' || name === 'src') &&
              !/^\s*(?:https?:|\/|#|mailto:)/i.test(value)) ||
            ((name === 'href' || name === 'src') &&
              /^\s*(?:javascript:|data:|vbscript:|file:)/i.test(value))
          ) {
            element.removeAttribute(attribute.name);
          }

          if (name === 'target') {
            element.setAttribute('rel', 'noopener noreferrer');
          }
        });
      });

      return document.body.innerHTML;
    }

    function renderContent(value) {
      const source = String(value || '');
      const html = /<\/?(p|div|h[1-6]|ul|ol|li|strong|em|u|a|img|blockquote|pre|code|table|span|br|font|style)\b/i.test(
        source
      )
        ? source
        : marked.parse(source || '_Belum ada isi materi._');

      return safeHtml(html);
    }

    function docBox(material) {
      if (!material.file_url) {
        return '';
      }

      const url = esc(material.file_url);
      const name = esc(material.file_name || 'Dokumen asli');
      const type = String(material.file_type || '').toLowerCase();
      const isPdf =
        type === 'application/pdf' || /\.pdf$/i.test(material.file_name || '');

      return (
        '<section class="docbox">' +
        '<div class="doc-actions">' +
        '<a class="doc-btn primary" target="_blank" rel="noopener" href="' +
        url +
        '">📄 Buka ' +
        name +
        '</a>' +
        '<a class="doc-btn" download href="' +
        url +
        '">⬇️ Unduh</a>' +
        '</div>' +
        (isPdf
          ? '<iframe class="pdf" title="' +
            name +
            '" src="' +
            url +
            '"></iframe>'
          : '<div style="color:var(--muted);font-size:13px">Dokumen tersedia sebagai file asli. Gunakan tombol Buka atau Unduh.</div>') +
        '</section>'
      );
    }

    async function refreshReading(materiId) {
      const { data: { user } } = await getDb().auth.getUser();
      const status = document.getElementById('reading-status');
      const checkbox = document.getElementById('reading-confirm');
      const button = document.getElementById('complete-reading');
      if (!user) {
        status.innerHTML = 'Login untuk menyimpan riwayat materi. <a href="../belajar/login.html" style="color:var(--primary);font-weight:800">Masuk / Daftar</a>';
        checkbox.disabled = true;
        button.disabled = true;
        return;
      }
      const { data, error } = await getDb().from('material_reading_history')
        .select('status').eq('user_id', user.id).eq('materi_id', materiId).maybeSingle();
      if (error) throw error;
      const completed = data?.status === 'completed';
      status.textContent = completed
        ? 'Materi sudah ditandai selesai dibaca dan masuk ke Riwayat Belajar.'
        : 'Baca materi sampai bagian paling bawah, lalu konfirmasi.';
      button.textContent = completed ? 'Sudah selesai dibaca' : 'Tandai sudah dibaca';
      checkbox.checked = completed;
      checkbox.disabled = completed || !window.__kryznaReachedBottom;
      button.disabled = completed || !window.__kryznaReachedBottom || !checkbox.checked;
    }

    async function completeReading(materiId) {
      const { data: { user } } = await getDb().auth.getUser();
      if (!user || !window.__kryznaReachedBottom) return;
      const checkbox = document.getElementById('reading-confirm');
      if (!checkbox?.checked) return;
      const now = new Date().toISOString();
      const { error } = await getDb().from('material_reading_history').upsert({
        user_id: user.id,
        materi_id: materiId,
        status: 'completed',
        first_read_at: now,
        last_read_at: now,
        completed_at: now,
        visit_count: 1
      }, { onConflict: 'user_id,materi_id' });
      if (error) throw error;
      await refreshReading(materiId);
    }

    function setupReadingConfirmation(materiId) {
      window.__kryznaReachedBottom = false;
      const checkbox = document.getElementById('reading-confirm');
      const button = document.getElementById('complete-reading');
      const sentinel = document.getElementById('reading-bottom-sentinel');

      const updateControls = () => {
        const completed = checkbox.checked && button.textContent === 'Sudah selesai dibaca';
        checkbox.disabled = completed || !window.__kryznaReachedBottom;
        button.disabled = completed || !window.__kryznaReachedBottom || !checkbox.checked;
      };

      const observer = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) {
          window.__kryznaReachedBottom = true;
          checkbox.disabled = false;
          updateControls();
        }
      }, { rootMargin: '0px 0px 80px 0px' });
      observer.observe(sentinel);

      checkbox.addEventListener('change', updateControls);
      button.addEventListener('click', async () => {
        button.disabled = true;
        try {
          await completeReading(materiId);
        } catch (error) {
          console.error(error);
          button.disabled = false;
          document.getElementById('reading-status').textContent =
            'Gagal menyimpan konfirmasi. Silakan coba lagi.';
        }
      });
    }

    async function loadEngagement(materiId) {
      const db=getDb(), box=document.getElementById('engagement');
      const { data:{user} }=await db.auth.getUser();
      if(!user){ box.hidden=false; box.innerHTML='<div class="docbox"><b>⭐ Simpan materi</b><p style="color:var(--muted);font-size:13px">Masuk untuk memakai bookmark dan memberikan feedback.</p><a class="doc-btn primary" href="../belajar/login.html">Masuk</a></div>'; return; }
      let bookmarked=false; const [{data:bm},{data:fb}]=await Promise.all([
        db.from('materi_bookmarks').select('id').eq('user_id',user.id).eq('materi_id',materiId).maybeSingle(),
        db.from('materi_feedback').select('id,rating,comment').eq('user_id',user.id).eq('materi_id',materiId).maybeSingle()
      ]);
      bookmarked=Boolean(bm); box.hidden=false;
      box.innerHTML='<div class="docbox"><div class="doc-actions"><button id="bookmarkBtn" class="doc-btn '+(bm?'primary':'')+'" type="button">'+(bm?'🔖 Tersimpan':'🔖 Bookmark')+'</button><a class="doc-btn" href="../belajar/bookmarks.html">Daftar Bookmark</a></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><b>⭐ Feedback materi</b><div style="display:grid;grid-template-columns:120px 1fr;gap:8px;margin-top:10px"><select id="feedbackRating"><option value="5">5 — Sangat membantu</option><option value="4">4 — Membantu</option><option value="3">3 — Cukup</option><option value="2">2 — Kurang</option><option value="1">1 — Tidak membantu</option></select><textarea id="feedbackComment" placeholder="Komentar singkat (opsional)" style="padding:10px;border:1px solid var(--line);border-radius:9px;min-height:70px">'+esc(fb?.comment||'')+'</textarea></div><button id="feedbackSave" class="doc-btn primary" type="button" style="margin-top:8px">Simpan Feedback</button><span id="feedbackStatus" style="margin-left:8px;color:var(--muted);font-size:13px"></span></div>';
      if(fb) document.getElementById('feedbackRating').value=String(fb.rating);
      document.getElementById('bookmarkBtn').onclick=async()=>{const btn=document.getElementById('bookmarkBtn');if(bookmarked){const r=await db.from('materi_bookmarks').delete().eq('user_id',user.id).eq('materi_id',materiId);if(r.error){alert(r.error.message);return}bookmarked=false;btn.className='doc-btn';btn.textContent='🔖 Bookmark';}else{const r=await db.from('materi_bookmarks').insert({user_id:user.id,materi_id:materiId});if(r.error){alert(r.error.message);return}bookmarked=true;btn.className='doc-btn primary';btn.textContent='🔖 Tersimpan';}};
      document.getElementById('feedbackSave').onclick=async()=>{const r=await db.from('materi_feedback').upsert({user_id:user.id,materi_id:materiId,rating:Number(document.getElementById('feedbackRating').value),comment:document.getElementById('feedbackComment').value.trim(),updated_at:new Date().toISOString()},{onConflict:'user_id,materi_id'});document.getElementById('feedbackStatus').textContent=r.error?'Gagal: '+r.error.message:'Feedback tersimpan.';};
    }

    async function load() {
      const slug = new URLSearchParams(location.search).get('slug');

      if (!slug) {
        app.innerHTML = '<div class="empty">Slug materi tidak ditemukan.</div>';
        return;
      }

      const db = getDb();

      if (!db) {
        app.innerHTML =
          '<div class="error">Koneksi Supabase belum siap. Silakan refresh halaman.</div>';
        return;
      }

      try {
        const { data, error } = await db
          .from('materi')
          .select(
            'id,judul,slug,deskripsi_singkat,kategori,konten,file_url,file_name,file_type'
          )
          .eq('slug', slug)
          .eq('status', 'published')
          .maybeSingle();

        if (error) {
          throw error;
        }

        if (!data) {
          app.innerHTML =
            '<div class="empty">Materi dengan slug <b>' +
            esc(slug) +
            '</b> tidak ditemukan atau belum dipublikasikan.</div>';
          return;
        }

        const material = data;

        document.title = material.judul + ' — Kryzna Learn';
        head.hidden = false;
        head.innerHTML =
          '<span class="kicker">' +
          esc(material.kategori || 'Umum') +
          '</span>' +
          '<h1>' +
          esc(material.judul) +
          '</h1>' +
          '<p class="desc">' +
          esc(
            material.deskripsi_singkat ||
              'Materi pembelajaran Kryzna Learn.'
          ) +
          '</p>';

        app.className = 'body';
        app.innerHTML =
          docBox(material) +
          '<div class="content">' +
          renderContent(material.konten) +
          '</div>' +
          '<div id="reading-bottom-sentinel" style="height:1px" aria-hidden="true"></div>';
        const reading = document.getElementById('reading');
        reading.hidden = false;
        reading.innerHTML = '<div style="border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)"><b>📚 Konfirmasi membaca</b><p id="reading-status" style="margin:5px 0;color:var(--muted);font-size:13px">Memuat status...</p><label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:14px"><input id="reading-confirm" type="checkbox" disabled> Saya sudah membaca materi ini sampai bagian paling bawah.</label><button id="complete-reading" class="theme" type="button" disabled>Tandai sudah dibaca</button> · <a href="../belajar/riwayat.html" style="color:var(--primary);font-weight:800">Buka riwayat</a></div>';
        await refreshReading(material.id);
        setupReadingConfirmation(material.id);
        await loadEngagement(material.id);
      } catch (error) {
        console.error(error);
        app.innerHTML =
          '<div class="error"><b>Materi gagal dimuat.</b><br>' +
          esc(error.message || error) +
          '</div>';
      }
    }

    const currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.dataset.theme = currentTheme;
    theme.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

    theme.onclick = () => {
      const nextTheme =
        document.documentElement.dataset.theme === 'dark'
          ? 'light'
          : 'dark';

      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem('theme', nextTheme);
      theme.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
    };

    load();
  </script>
</body>
</html>
