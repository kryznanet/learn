<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materi — Kryzna Learn</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../supabase-config.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #fff;
      --text: #102033;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #2563eb;
    }

    [data-theme="dark"] {
      --bg: #07101d;
      --surface: #0f1a2c;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --line: #30425d;
      --primary: #60a5fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Arial, sans-serif;
      line-height: 1.75;
    }

    .wrap {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px 70px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .back {
      color: var(--primary);
      font-weight: 800;
      text-decoration: none;
    }

    .theme {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 10px;
      cursor: pointer;
    }

    .article {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
    }

    .head {
      padding: 32px 40px;
      border-bottom: 1px solid var(--line);
    }

    .head h1 {
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.1;
      margin: 12px 0;
    }

    .kicker {
      color: var(--primary);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .desc {
      color: var(--muted);
      margin-bottom: 0;
    }

    .body {
      padding: 32px 40px;
    }

    .content {
      font-size: 17px;
    }

    .content img {
      max-width: 100%;
      height: auto;
    }

    .content pre {
      background: #0b1220;
      color: #fff;
      padding: 16px;
      border-radius: 12px;
      overflow: auto;
    }

    .content code {
      font-family: Consolas, monospace;
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
    }

    .content th,
    .content td {
      border: 1px solid var(--line);
      padding: 8px;
      text-align: left;
    }

    .content a {
      color: var(--primary);
    }

    .docbox {
      margin-bottom: 26px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--bg);
    }

    .doc-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .doc-btn {
      display: inline-flex;
      padding: 9px 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 800;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
    }

    .doc-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .pdf {
      width: 100%;
      height: min(80vh, 900px);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 80px 20px;
    }

    .error {
      margin: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
    }

    @media (max-width: 600px) {
      .head,
      .body {
        padding: 24px 18px;
      }

      .wrap {
        padding: 20px 12px 50px;
      }

      .pdf {
        height: 65vh;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="../index.html">← Kembali ke materi</a>
      <button class="theme" id="theme" type="button">🌙</button>
    </div>

    <article class="article">
      <div id="head" class="head" hidden></div>
      <div id="app" class="empty">Memuat materi...</div>
    </article>
  </main>

  <script>
    const app = document.getElementById('app');
    const head = document.getElementById('head');
    const theme = document.getElementById('theme');

    function getDb() {
      return window.supabaseClient || null;
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    function safeHtml(value) {
      const document = new DOMParser().parseFromString(
        value || '',
        'text/html'
      );

      document
        .querySelectorAll('script,iframe,object,embed,form,link,meta')
        .forEach((element) => element.remove());

      document.querySelectorAll('*').forEach((element) => {
        [...element.attributes].forEach((attribute) => {
          const name = attribute.name.toLowerCase();
          const value = attribute.value || '';

          if (
            /^on/i.test(name) ||
            name === 'srcdoc' ||
            name === 'style' ||
            ((name === 'href' || name === 'src') &&
              !/^\s*(?:https?:|\/|#|mailto:)/i.test(value)) ||
            ((name === 'href' || name === 'src') &&
              /^\s*(?:javascript:|data:|vbscript:|file:)/i.test(value))
          ) {
            element.removeAttribute(attribute.name);
          }

          if (name === 'target') {
            element.setAttribute('rel', 'noopener noreferrer');
          }
        });
      });

      return document.body.innerHTML;
    }

    function renderContent(value) {
      const source = String(value || '');
      const html = /<\/?(p|div|h[1-6]|ul|ol|li|strong|em|u|a|img|blockquote|pre|code|table|span|br|font|style)\b/i.test(
        source
      )
        ? source
        : marked.parse(source || '_Belum ada isi materi._');

      return safeHtml(html);
    }

    function docBox(material) {
      if (!material.file_url) {
        return '';
      }

      const url = esc(material.file_url);
      const name = esc(material.file_name || 'Dokumen asli');
      const type = String(material.file_type || '').toLowerCase();
      const isPdf =
        type === 'application/pdf' || /\.pdf$/i.test(material.file_name || '');

      return (
        '<section class="docbox">' +
        '<div class="doc-actions">' +
        '<a class="doc-btn primary" target="_blank" rel="noopener" href="' +
        url +
        '">📄 Buka ' +
        name +
        '</a>' +
        '<a class="doc-btn" download href="' +
        url +
        '">⬇️ Unduh</a>' +
        '</div>' +
        (isPdf
          ? '<iframe class="pdf" title="' +
            name +
            '" src="' +
            url +
            '"></iframe>'
          : '<div style="color:var(--muted);font-size:13px">Dokumen tersedia sebagai file asli. Gunakan tombol Buka atau Unduh.</div>') +
        '</section>'
      );
    }

    async function load() {
      const slug = new URLSearchParams(location.search).get('slug');

      if (!slug) {
        app.innerHTML = '<div class="empty">Slug materi tidak ditemukan.</div>';
        return;
      }

      const db = getDb();

      if (!db) {
        app.innerHTML =
          '<div class="error">Koneksi Supabase belum siap. Silakan refresh halaman.</div>';
        return;
      }

      try {
        const { data, error } = await db
          .from('materi')
          .select(
            'id,judul,slug,deskripsi_singkat,kategori,konten,file_url,file_name,file_type'
          )
          .eq('slug', slug)
          .eq('status', 'published')
          .maybeSingle();

        if (error) {
          throw error;
        }

        if (!data) {
          app.innerHTML =
            '<div class="empty">Materi dengan slug <b>' +
            esc(slug) +
            '</b> tidak ditemukan atau belum dipublikasikan.</div>';
          return;
        }

        const material = data;

        document.title = material.judul + ' — Kryzna Learn';
        head.hidden = false;
        head.innerHTML =
          '<span class="kicker">' +
          esc(material.kategori || 'Umum') +
          '</span>' +
          '<h1>' +
          esc(material.judul) +
          '</h1>' +
          '<p class="desc">' +
          esc(
            material.deskripsi_singkat ||
              'Materi pembelajaran Kryzna Learn.'
          ) +
          '</p>';

        app.className = 'body';
        app.innerHTML =
          docBox(material) +
          '<div class="content">' +
          renderContent(material.konten) +
          '</div>';
      } catch (error) {
        console.error(error);
        app.innerHTML =
          '<div class="error"><b>Materi gagal dimuat.</b><br>' +
          esc(error.message || error) +
          '</div>';
      }
    }

    const currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.dataset.theme = currentTheme;
    theme.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

    theme.onclick = () => {
      const nextTheme =
        document.documentElement.dataset.theme === 'dark'
          ? 'light'
          : 'dark';

      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem('theme', nextTheme);
      theme.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
    };

    load();
  </script>
</body>
</html>
