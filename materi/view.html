<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Materi — Kryzna Learn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="../supabase-config.js"></script>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#eef3fa;--text:#102033;--muted:#64748b;--line:#e2e8f0;--primary:#2563eb;--cyan:#06b6d4;--navy:#09111f;--shadow:0 18px 45px rgba(15,23,42,.08)}
[data-theme=dark]{--bg:#07101d;--surface:#0f1a2c;--surface2:#15243a;--text:#eef6ff;--muted:#9fb0c7;--line:#24344b;--primary:#60a5fa;--cyan:#22d3ee;--navy:#030913;--shadow:0 24px 60px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 20% 0,#e7f2ff 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;line-height:1.75}a{color:inherit}
header{position:sticky;top:0;z-index:50;background:rgba(9,17,31,.9);backdrop-filter:blur(18px);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}.nav{max-width:1320px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.logo{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#60a5fa,#22d3ee);color:#07101d;font-weight:950}.brand b{font-size:16px}.brand small{display:block;color:#9eb0c7;font-size:10px}.nav-actions{display:flex;gap:7px;align-items:center}.nav-btn{border:1px solid rgba(255,255,255,.13);background:transparent;color:#dbe8f7;text-decoration:none;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:800}.nav-btn:hover{background:rgba(255,255,255,.08)}
.wrap{max-width:1320px;margin:0 auto;padding:34px 22px 70px}.back{display:inline-flex;align-items:center;gap:7px;color:var(--primary);font-size:13px;font-weight:850;text-decoration:none;margin-bottom:18px}.back:hover{text-decoration:underline}.article{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.article-head{padding:34px 44px 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(248,251,255,.9),var(--surface))}.kicker{display:inline-flex;padding:6px 10px;background:var(--surface2);color:var(--primary);border-radius:999px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:900}.article-head h1{font-size:clamp(32px,4.4vw,54px);line-height:1.08;letter-spacing:-.04em;margin:14px 0 10px}.desc{max-width:850px;color:var(--muted);margin:0;font-size:16px}.article-body{padding:32px 44px 48px}.content{max-width:890px;margin:0 auto;font-size:17px}.content h1,.content h2,.content h3,.content h4{line-height:1.25;letter-spacing:-.02em;margin-top:1.6em}.content h1{font-size:34px}.content h2{font-size:28px}.content h3{font-size:22px}.content p{margin:0 0 1.05em}.content a{color:var(--primary);font-weight:650}.content blockquote{margin:20px 0;padding:14px 18px;border-left:4px solid var(--primary);background:var(--surface2);border-radius:0 12px 12px 0;color:var(--muted)}.content ul,.content ol{padding-left:25px}.content li{margin:5px 0}.content pre{background:#0a1220;color:#e5eefb;padding:17px;border-radius:13px;overflow:auto;border:1px solid #22334b}.content code{font-family:Consolas,monospace}.content :not(pre)>code{background:var(--surface2);padding:2px 6px;border-radius:6px}.content table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px;display:block;overflow:auto}.content th,.content td{border:1px solid var(--line);padding:9px 11px;text-align:left;min-width:120px}.content th{background:var(--surface2)}.content img{max-width:100%;height:auto;border-radius:12px}.content hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.filebox{margin:0 0 30px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface2)}.pdfbox{background:#0b1321}.pdf-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;background:linear-gradient(135deg,#0b1321,#12233a);color:#fff}.pdf-title{display:flex;align-items:center;gap:10px}.pdf-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#ef4444;color:#fff;font-weight:900}.pdf-head strong{font-size:14px}.pdf-head p{margin:0;color:#a9b9ce;font-size:11px}.pdf-open{color:#fff;background:linear-gradient(135deg,var(--primary),var(--cyan));text-decoration:none;padding:9px 12px;border-radius:9px;font-size:11px;font-weight:850;white-space:nowrap}.pdf-viewer{width:100%;height:min(92vh,1250px);min-height:760px;border:0;display:block;background:#fff}.wordbox{padding:18px;background:var(--surface2)}.wordbox strong{font-size:15px}.file-action{display:inline-flex;margin-top:10px;background:var(--primary);color:#fff;text-decoration:none;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:850}.empty{text-align:center;color:var(--muted);padding:80px 20px}
@media(max-width:800px){.wrap{padding:20px 14px 45px}.article-head{padding:26px 22px 22px}.article-body{padding:24px 20px 38px}.content{font-size:16px}.pdf-head{align-items:flex-start;flex-direction:column}.pdf-viewer{height:80vh;min-height:620px}}
@media(max-width:520px){.brand small{display:none}.nav-actions .home-label{display:none}.article{border-radius:18px}.article-head h1{font-size:34px}.desc{font-size:14px}.article-body{padding:20px 16px 32px}.content h1{font-size:29px}.content h2{font-size:24px}.pdf-viewer{height:78vh;min-height:560px}}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="../index.html"><span class="logo">K</span><span><b>Kryzna Learn</b><small>Jaringan • Komputer • Teknologi</small></span></a><div class="nav-actions"><a class="nav-btn home-label" href="../index.html">← Beranda</a><button class="nav-btn" id="theme" aria-label="Ganti tema">🌙</button></div></div></header>
<main class="wrap"><a class="back" href="../index.html">← Kembali ke koleksi materi</a><article class="article"><div id="head" class="article-head" hidden></div><div id="app" class="empty">Memuat materi...</div></article></main>
<script>
const db=supabaseClient;marked.setOptions({gfm:true,breaks:true});document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';const theme=document.getElementById('theme');theme.textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';theme.addEventListener('click',toggleTheme);
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);theme.textContent=t==='dark'?'☀️':'🌙'}
function safeStyleText(s){return String(s||'').replace(/@import[^;]+;?/gi,'').replace(/javascript\s*:/gi,'').replace(/expression\s*\([^)]*\)/gi,'').replace(/behavior\s*:/gi,'').replace(/-moz-binding\s*:/gi,'')}
function sanitize(html){const d=new DOMParser().parseFromString(html||'','text/html');d.querySelectorAll('script,iframe,object,embed,form,link,meta').forEach(e=>e.remove());d.querySelectorAll('*').forEach(e=>{[...e.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value||'';if(/^on/i.test(n)||n==='srcdoc'||((n==='href'||n==='src')&&/^\s*(javascript:|data:text\/html)/i.test(v))||(n==='style'&&/expression\s*\(|javascript\s*:|behavior\s*:|binding\s*:/i.test(v)))e.removeAttribute(a.name)});if(e.tagName==='IMG'){e.setAttribute('loading','lazy');e.removeAttribute('srcset')}});d.querySelectorAll('style').forEach(s=>s.textContent=safeStyleText(s.textContent));return d.body.innerHTML}
function looksLikeHtml(v){return /<\/?(p|div|h[1-6]|ul|ol|li|strong|em|u|s|a|img|blockquote|pre|code|table|span|br|font|style)\b/i.test(v||'')}
function renderContent(v){return sanitize(looksLikeHtml(v)?v:marked.parse(v||'_Belum ada isi materi._'))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fileBlock(x){if(!x.file_url)return '';const url=esc(x.file_url),name=esc(x.file_name||'Dokumen materi');if(String(x.file_type||'').includes('pdf')||/\.pdf($|\?)/i.test(x.file_name||'')){return '<section class="filebox pdfbox"><div class="pdf-head"><div class="pdf-title"><span class="pdf-icon">PDF</span><div><strong>'+name+'</strong><p>Dokumen asli • tampil langsung di halaman</p></div></div><a class="pdf-open" target="_blank" rel="noopener" href="'+url+'">Buka Tab Baru ↗</a></div><iframe class="pdf-viewer" title="PDF materi" src="'+url+'#toolbar=1&navpanes=0&view=FitH"></iframe></section>'}return '<section class="filebox wordbox"><strong>📄 Dokumen Word asli</strong><div style="color:var(--muted);font-size:13px;margin-top:3px">Versi DOCX tetap tersedia semula tanpa konversi.</div><a class="file-action" target="_blank" rel="noopener" href="'+url+'">Buka / Download Word</a></section>'}
async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){app.innerHTML='<div class="empty">Materi tidak ditemukan.</div>';return}const {data,error}=await db.from('materi').select('judul,deskripsi_singkat,kategori,konten,slug,file_url,file_name,file_type').eq('slug',slug).maybeSingle();if(error||!data){app.innerHTML='<div class="empty">Materi tidak ditemukan.</div>';return}document.title=data.judul+' — Kryzna Learn';document.getElementById('head').hidden=false;document.getElementById('head').innerHTML='<span class="kicker">'+esc(data.kategori||'Umum')+'</span><h1>'+esc(data.judul)+'</h1><p class="desc">'+esc(data.deskripsi_singkat||'Materi pembelajaran Kryzna Learn.')+'</p>';app.className='article-body';app.innerHTML=fileBlock(data)+'<div class="content">'+renderContent(data.konten)+'</div>'}load();
</script>
</body>
</html>
