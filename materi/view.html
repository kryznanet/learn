<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materi — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="../supabase-config.js"></script><style>body{margin:0;background:#f5f7fb;color:#102033;font-family:Inter,Segoe UI,Arial,sans-serif;line-height:1.75}.wrap{max-width:1000px;margin:auto;padding:30px 20px 70px}.back{display:inline-block;color:#2563eb;font-weight:800;text-decoration:none;margin-bottom:18px}.article{background:#fff;border:1px solid #e2e8f0;border-radius:22px;overflow:hidden}.head{padding:32px 40px;border-bottom:1px solid #e2e8f0}.head h1{font-size:clamp(32px,5vw,54px);line-height:1.1;margin:12px 0}.kicker{color:#2563eb;font-size:11px;font-weight:900;text-transform:uppercase}.desc{color:#64748b}.body{padding:32px 40px}.content{font-size:17px}.content img{max-width:100%;height:auto}.content pre{background:#0b1220;color:#fff;padding:16px;border-radius:12px;overflow:auto}.content table{width:100%;border-collapse:collapse}.content th,.content td{border:1px solid #e2e8f0;padding:8px;text-align:left}.empty{text-align:center;color:#64748b;padding:80px 20px}.error{margin:20px;padding:14px;border-radius:12px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}@media(max-width:600px){.head,.body{padding:24px 18px}}</style></head><body><main class="wrap"><a class="back" href="../index.html">← Kembali ke materi</a><article class="article"><div id="head" class="head" hidden></div><div id="app" class="empty">Memuat materi...</div></article></main><script>
const app=document.getElementById('app');const head=document.getElementById('head');
function getDb(){if(window.supabaseClient)return window.supabaseClient;if(typeof supabaseClient!=='undefined')return supabaseClient;return null}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function safeHtml(v){const d=new DOMParser().parseFromString(v||'','text/html');d.querySelectorAll('script,iframe,object,embed,form,link,meta').forEach(x=>x.remove());d.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||((a.name==='href'||a.name==='src')&&/^\s*(javascript:|data:text\/html)/i.test(a.value)))e.removeAttribute(a.name)}));return d.body.innerHTML}
function renderContent(v){const s=String(v||'');return /<\/?(p|div|h[1-6]|ul|ol|li|strong|em|u|a|img|blockquote|pre|code|table|span|br)\b/i.test(s)?safeHtml(s):safeHtml(marked.parse(s||'_Belum ada isi materi._'))}
async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){app.innerHTML='<div class="empty">Slug materi tidak ditemukan.</div>';return}const db=getDb();if(!db){app.innerHTML='<div class="error">Koneksi Supabase belum siap. Silakan refresh halaman.</div>';return}try{const r=await db.from('materi').select('id,judul,slug,deskripsi_singkat,kategori,konten,file_url,file_name,file_type').eq('slug',slug).maybeSingle();if(r.error)throw r.error;if(!r.data){app.innerHTML='<div class="empty">Materi dengan slug <b>'+esc(slug)+'</b> tidak ditemukan.</div>';return}const x=r.data;document.title=x.judul+' — Kryzna Learn';head.hidden=false;head.innerHTML='<span class="kicker">'+esc(x.kategori||'Umum')+'</span><h1>'+esc(x.judul)+'</h1><p class="desc">'+esc(x.deskripsi_singkat||'Materi pembelajaran Kryzna Learn.')+'</p>';app.className='body';let file='';if(x.file_url){const u=esc(x.file_url);file='<p><a target="_blank" rel="noopener" href="'+u+'">📄 Buka dokumen asli</a></p>'}app.innerHTML=file+'<div class="content">'+renderContent(x.konten)+'</div>'}catch(e){console.error(e);app.innerHTML='<div class="error"><b>Materi gagal dimuat.</b><br>'+esc(e.message||e)+'</div>'}}
load();</script></body></html>
