<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ujian Online — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>:root{--bg:#f6f8fc;--card:#fff;--line:#dbe3ee;--text:#172033;--muted:#64748b;--primary:#2563eb;--soft:#eef3fa}*{box-sizing:border-box}body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}.wrap{max-width:1000px;margin:auto;padding:28px 18px}.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav a{color:#1d4ed8;font-weight:800;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.btn{display:inline-block;padding:10px 13px;border-radius:10px;background:var(--primary);color:#fff;text-decoration:none;font-weight:800}.muted{color:var(--muted);line-height:1.6}.filters{display:flex;gap:9px;margin:18px 0;flex-wrap:wrap}.filters input,.filters select{padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.filters input{flex:1;min-width:220px}.empty{text-align:center;grid-column:1/-1;padding:30px}@media(max-width:700px){.grid{grid-template-columns:1fr}.filters input,.filters select{width:100%}}</style></head><body><main class="wrap"><div class="nav"><a href="../belajar/index.html">← Belajar Saya</a><a href="../belajar/ujian-riwayat.html">Riwayat Ujian →</a></div><h1>Ujian Online</h1><p class="muted">Pilih ujian berdasarkan kategori. Waktu pengerjaan dan nilai lulus ditampilkan sebelum Anda mulai.</p><div class="filters"><input id="search" type="search" placeholder="Cari ujian…" aria-label="Cari ujian"><select id="category" aria-label="Filter kategori"><option value="all">Semua kategori</option></select></div><div id="g" class="grid"><div class="card empty">Memuat...</div></div></main><script>const db=supabaseClient,$=x=>document.getElementById(x);let rows=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value;const data=rows.filter(x=>{const c=x.exam_categories?.label||'';return(cat==='all'||c===cat)&&(!q||String(x.title||'').toLowerCase().includes(q)||String(x.description||'').toLowerCase().includes(q))});if(!data.length){$('g').innerHTML='<div class="card empty">'+(rows.length?'Tidak ada ujian yang cocok dengan filter.':'Belum ada ujian yang tersedia.')+'</div>';return}$('g').innerHTML=data.map(x=>{const c=x.exam_categories?.label||'Ujian';return '<article class="card"><div>📝 <b>'+esc(c)+'</b></div><h2>'+esc(x.title)+'</h2><p class="muted">'+esc(x.description)+'</p><p class="muted"><b>'+x.duration_minutes+' menit</b> · Nilai lulus '+x.passing_score+'</p><a class="btn" href="kerjakan.html?exam='+encodeURIComponent(x.id)+'">Mulai ujian</a></article>'}).join('')}async function load(){const{data,error}=await db.from('exams').select('id,title,description,duration_minutes,passing_score,category_id,exam_categories(name,label)').eq('is_published',true).is('archived_at',null).order('category_id');if(error){$('g').innerHTML='<div class="card empty">Gagal memuat ujian: '+esc(error.message)+'</div>';return}rows=data||[];const cats=[...new Set(rows.map(x=>x.exam_categories?.label).filter(Boolean))].sort();$('category').innerHTML='<option value="all">Semua kategori</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');render()}$('search').oninput=render;$('category').onchange=render;load()</script></body></html>
