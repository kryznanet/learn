<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ujian Online — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>body{font-family:Arial;margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:20px}.btn{display:inline-block;padding:10px 13px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800}.muted{color:#64748b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class=wrap><a href="../index.html">← Website</a><h1>Ujian Online</h1><p class=muted>Ujian tersedia berdasarkan kategori materi.</p><div id=g class=grid>Memuat...</div></main><script>const db=supabaseClient,$=x=>document.getElementById(x);async function load(){const{data,error}=await db.from('exams').select('id,title,description,duration_minutes,passing_score,category_id,exam_categories(name,label)').eq('is_published',true).order('category_id');if(error){$('g').textContent=error.message;return}$('g').innerHTML=(data||[]).map(x=>'<article class=card><div>📝 <b>'+x.exam_categories.label+'</b></div><h2>'+esc(x.title)+'</h2><p class=muted>'+esc(x.description)+'</p><p class=muted>'+x.duration_minutes+' menit · Nilai lulus '+x.passing_score+'</p><a class=btn href="kerjakan.html?exam='+x.id+'">Mulai ujian</a></article>').join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load()</script></body></html>
