<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kerjakan Ujian — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>:root{--bg:#f6f8fc;--card:#fff;--line:#dbe3ee;--text:#172033;--muted:#64748b;--primary:#2563eb}*{box-sizing:border-box}body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}.wrap{max-width:900px;margin:auto;padding:25px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:12px 0}.opt{display:block;border:1px solid var(--line);padding:11px;border-radius:10px;margin:7px 0;cursor:pointer}.opt:has(input:checked){border-color:#2563eb;background:#eef3ff}.top{display:flex;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}.timer{padding:8px 11px;border-radius:10px;background:#fff;border:1px solid var(--line);font-variant-numeric:tabular-nums}.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.result{font-size:18px}.muted{color:var(--muted);line-height:1.6}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;font-size:13px;margin:12px 0}@media(max-width:560px){.top{align-items:flex-start}}</style></head><body><main class=wrap><div class=top><a href="index.html">← Ujian</a><b class=timer id=timer>--:--</b></div><h1 id=title>Memuat...</h1><div id=meta class=muted></div><div id=notice></div><div id=q></div><button id=sub class=btn disabled>Kumpulkan ujian</button><div id=r></div></main><script>const db=supabaseClient,$=x=>document.getElementById(x);let attempt=null,questions=[],answers=new Map(),deadline=null,submitted=false,timerId=null;const fn=db.functions;async function start(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='../belajar/login.html';return}const examId=new URLSearchParams(location.search).get('exam');if(!examId){$('q').innerHTML='<div class="card">ID ujian tidak ditemukan.</div>';return}const{data,error}=await fn.invoke('exam-api',{body:{action:'start',examId}});if(error){$('q').innerHTML='<div class="card">Gagal memulai ujian: '+esc(error.message)+'</div>';return}attempt=data.attempt;questions=data.questions||[];deadline=new Date(data.deadline);$('title').textContent=data.exam.title;$('meta').textContent=questions.length+' soal · '+data.exam.duration_minutes+' menit · Nilai lulus '+data.exam.passing_score;render();$('sub').disabled=false;tick();timerId=setInterval(tick,1000)}function render(){$('q').innerHTML=questions.map((x,i)=>'<article class=card><b>'+ (i+1)+'. '+esc(x.text)+'</b>'+x.options.map(o=>'<label class=opt><input type=radio name=q'+i+' value='+o.id+'> '+esc(o.key)+'. '+esc(o.text)+'</label>').join('')+'</article>').join('')||'<div class=card>Tidak ada soal tersedia.</div>';$('q').querySelectorAll('input').forEach(i=>i.onchange=()=>answers.set(i.name.slice(1),i.value))}function tick(){if(submitted)return;const left=Math.max(0,deadline-Date.now()),s=Math.floor(left/1000),m=Math.floor(s/60),r=s%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');if(left<=300000&&left>0)$('notice').innerHTML='<div class="notice">Waktu tersisa kurang dari 5 menit. Pastikan jawaban sudah diperiksa.</div>';if(left===0)submit(true)}async function submit(auto=false){if(submitted)return;submitted=true;if(timerId)clearInterval(timerId);$('sub').disabled=true;const unanswered=questions.filter((q,i)=>!answers.has(String(i))).length;if(!auto&&unanswered){const ok=confirm('Masih ada '+unanswered+' soal yang belum dijawab. Kumpulkan sekarang?');if(!ok){submitted=false;$('sub').disabled=false;return}}$('notice').innerHTML=auto?'<div class="notice">Waktu habis. Jawaban dikumpulkan otomatis.</div>':'';const payload=questions.map((q,i)=>({questionId:q.id,optionId:answers.get(String(i))||null}));const{data,error}=await fn.invoke('exam-api',{body:{action:'submit',attemptId:attempt.id,answers:payload}});if(error){submitted=false;$('sub').disabled=false;$('r').innerHTML='<div class="card">Gagal mengumpulkan: '+esc(error.message)+'</div>';return}$('r').innerHTML='<div class="card result"><b>Hasil: '+esc(data.score)+'</b><br>'+esc(data.correctCount)+' dari '+esc(data.totalQuestions)+' benar<br>Status: '+(data.passed?'Lulus':'Belum lulus')+'<br><a href="index.html">Kembali ke daftar ujian</a> · <a href="../belajar/ujian-riwayat.html">Lihat riwayat</a></div>';$('sub').style.display='none';window.scrollTo(0,document.body.scrollHeight)}$('sub').onclick=()=>submit(false);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}start()</script></body></html>
