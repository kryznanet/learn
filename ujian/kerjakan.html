<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kerjakan Ujian — Kryzna Learn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>body{font-family:Arial;margin:0;background:#f6f8fc;color:#172033}.wrap{max-width:900px;margin:auto;padding:25px 18px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:20px;margin:12px 0}.opt{display:block;border:1px solid #dbe3ee;padding:11px;border-radius:10px;margin:7px 0;cursor:pointer}.top{display:flex;justify-content:space-between;gap:10px;position:sticky;top:0;background:#f6f8fc;padding:10px 0;z-index:2}.btn{padding:12px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.result{font-size:18px}.muted{color:#64748b}</style></head><body><main class=wrap><div class=top><a href="index.html">← Ujian</a><b id=timer>--:--</b></div><h1 id=title>Memuat...</h1><div id=q></div><button id=sub class=btn>Kumpulkan ujian</button><div id=r></div></main><script>const db=supabaseClient,$=x=>document.getElementById(x);let attempt=null,questions=[],answers=new Map(),deadline=null;const fn=db.functions;async function start(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='../belajar/login.html';return}const examId=new URLSearchParams(location.search).get('exam');const{data,error}=await fn.invoke('exam-api',{body:{action:'start',examId}});if(error){$('q').textContent=error.message;return}attempt=data.attempt;questions=data.questions;deadline=new Date(data.deadline);$('title').textContent=data.exam.title;render();tick();setInterval(tick,1000)}function render(){$('q').innerHTML=questions.map((x,i)=>'<article class=card><b>'+ (i+1)+'. '+esc(x.text)+'</b>'+x.options.map(o=>'<label class=opt><input type=radio name=q'+i+' value='+o.id+'> '+o.key+'. '+esc(o.text)+'</label>').join('')+'</article>').join('');$('q').querySelectorAll('input').forEach(i=>i.onchange=()=>answers.set(i.name.slice(1),i.value))}function tick(){const left=Math.max(0,deadline-Date.now()),s=Math.floor(left/1000),m=Math.floor(s/60),r=s%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');if(left===0)submit(true)}async function submit(auto=false){$('sub').disabled=true;const payload=questions.map((q,i)=>({questionId:q.id,optionId:answers.get(String(i))||null}));const{data,error}=await fn.invoke('exam-api',{body:{action:'submit',attemptId:attempt.id,answers:payload}});if(error){$('r').innerHTML='<div class=card>'+esc(error.message)+'</div>';$('sub').disabled=false;return}$('r').innerHTML='<div class=card result><b>Hasil: '+data.score+'</b><br>'+data.correctCount+' dari '+data.totalQuestions+' benar<br>Status: '+(data.passed?'Lulus':'Belum lulus')+'<br><a href="index.html">Kembali ke daftar ujian</a></div>';$('sub').style.display='none';window.scrollTo(0,document.body.scrollHeight)}$('sub').onclick=()=>submit(false);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}start()</script></body></html>
